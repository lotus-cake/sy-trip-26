规则:同一预订(预约号/日期+名称相同)用 update + 已有 id,只放需要改的字段;待订(status todo)的行程被这封确认邮件订好时,update 它为 status:"booked" 并写 conf;出差期 ${S.trip.bizStart||""}~${S.trip.bizEnd||""} 内默认 biz:business,其余 personal;只返回 JSON。`;
  const content=[...imgs.map(b=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b.split(",")[1]}})),
    {type:"text",text:`现有行程(用来判断是更新还是新增):\n${JSON.stringify(compactTrip())}\n\n${schema}\n\n要导入的内容:\n${text||"(见图片)"}`}];
  try{ const out=await askClaude(content,3000); const j=parseJSON(out); window._imPreview=(j.items||[]).map((it,i)=>({...it,_on:true,_i:i})); $("#im_out").innerHTML=importPreviewHTML(); }
  catch(e){ $("#im_out").innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
}
function importPreviewHTML(){
  const L=window._imPreview||[]; if(!L.length) return `<div class="empty">没有识别到预订信息</div>`;
  const lab={event:"行程",hotel:"住宿",expense:"花费"};
  return `<div class="rowlist">${L.map(it=>{ const ex=it.op==="update"&&it.id?((it.target==="hotel"?S.hotels:it.target==="expense"?S.expenses:S.events)||{})[it.id]:null;
    return `<div class="check" onclick="window._imPreview[${it._i}]._on=!window._imPreview[${it._i}]._on;$('#im_out').innerHTML=importPreviewHTML()"><span class="ck ${it._on?"on":""}">${it._on?"✓":""}</span>
    <div style="flex:1"><div class="ct">${it.op==="update"?"更新":"新增"}${lab[it.target]||""} · ${esc(it.summary||"")}</div>
    <div class="cd">${ex?`原:${esc(ex.title||ex.name||ex.merchant||it.id)} → `:""}${esc(Object.entries(it.data||{}).filter(([k])=>!["note"].includes(k)).map(([k,v])=>k+": "+v).join(" · ").slice(0,220))}</div></div></div>`; }).join("")}</div>
  <div class="btns"><button class="btn ghost" onclick="window._imPreview=null;window._imImgs=[];render()">放弃</button><button class="btn b" onclick="applyImport()">写进行程</button></div>`;
}
function applyImport(){
  const L=(window._imPreview||[]).filter(x=>x._on); let n=0;
  L.forEach(it=>{
    const col=it.target==="hotel"?"hotels":it.target==="expense"?"expenses":"events"; const d={...(it.data||{})};
    Object.keys(d).forEach(k=>{ if(d[k]===null||d[k]==="") delete d[k]; });
    if(col!=="expenses") d.edited=Date.now();
    if(col==="expenses"){ d.ts=Date.now(); d.rate=rate(d.currency); d.noReceipt=true; }
    if(it.op==="update"&&it.id&&(S[col]||{})[it.id]){ patch(col+"/"+it.id,d); }
    else { push(col,d); }
    logChange(d.date||d.checkIn||today(),`导入:${it.summary||d.title||d.name||""}`); n++;
  });
  window._imPreview=null; window._imImgs=[]; toast(`已写入 ${n} 项 ✓`); render();
}

/* ---- 攻略 ---- */
function renderGuide(){
  let h=backTools()+`<div class="bigdate" style="font-size:22px;margin:4px 2px 12px;">攻略</div>`;
  h+=((S.guide)||[]).map(s=>`<div class="g-card"><h3>${s.t}</h3><ul>${(s.items||[]).map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")||`<div class="empty">还没有攻略</div>`;
  $("#view").innerHTML=h;
}

/* ---- 行程档案:住过的、吃过的、每天的变化、最终花费 ---- */
function archiveData(){
  const hotels=hotelsList(); const foods=evList().filter(e=>e.kind==="food"||e.kind==="activity"||e.kind==="work");
  const byCity={}; const addC=(c,x)=>{ (byCity[c||"其他"]=byCity[c||"其他"]||[]).push(x); };
  hotels.forEach(h=>addC(h.city,{t:"hotel",o:h})); foods.forEach(e=>addC(e.city||(hotelOn(e.date)||{}).city,{t:e.kind,o:e}));
  return byCity;
}
function renderArchive(){
  const byCity=archiveData(), ex=expList(), co=ex.filter(isCo);
  const logs=Object.values(S.log||{}).sort((a,b)=>(a.ts||0)-(b.ts||0)); const jr=S.journal||{};
  let h=backTools()+`<div class="bigdate" style="font-size:22px;margin:4px 2px 2px;">行程档案</div><div class="muted" style="margin:0 2px 12px;">${esc(S.trip.title)} · ${dstr(S.trip.start)}–${dstr(S.trip.end)} · 下次找回喜欢的店</div>
  <div class="stat-grid"><div class="stat"><div class="lb"><span class="dot b"></span>公司</div><div class="big">${c$(sumBy(co,companyCAD))}</div><div class="sm">${co.length} 笔</div></div>
  <div class="stat"><div class="lb"><span class="dot p"></span>私人</div><div class="big">${c$(sumBy(ex,personalCAD))}</div><div class="sm">未对账 ${ex.filter(needsPaid).length} · 缺票据 ${co.filter(e=>!e.receipt&&!e.noReceipt).length}</div></div></div>`;
  Object.entries(byCity).forEach(([city,list])=>{
    h+=`<div class="sec-h"><h2 style="font-size:16px;">${esc(city)}</h2></div><div class="rowlist">${list.map(x=>{ const o=x.o, r=+o.rating||0, isH=x.t==="hotel";
      return `<div class="row" onclick="${isH?`openHotel('${o.id}')`:`selDay='${o.date}';openCard['${o.id}']=true;goTab('plan')`}"><span class="ri ${isH?"green":"blue"}">${ic(isH?"bed":KIND[o.kind].icon)}</span>
      <div class="rm"><div class="rt">${esc(isH?o.name:o.title)}</div><div class="rs">${isH?`${dstr(o.checkIn)}–${dstr(o.checkOut)}`:dstr(o.date)}${r?" · "+"★".repeat(r):""}${o.review?" · "+esc(o.review):""}</div></div></div>`; }).join("")}</div>`;
  });
  h+=`<div class="sec-h"><h2 style="font-size:16px;">每天的记录</h2></div><div class="rowlist">`+tripDays().map(d=>{ const lg=logs.filter(l=>l.date===d); const j=jr[d]||{}; const ph=Object.values(j.photos||{});
    return `<div style="padding:10px 0;border-top:1px solid var(--line);"><div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:14px;">${dstr(d)} 周${weekday(d)} · ${esc(dayCities(d).join(" → "))}</b><button class="mini" onclick="addJournalPhoto('${d}')">${ic("cam")} 照片</button></div>
      ${lg.length?`<div class="muted" style="margin-top:3px;">${lg.map(l=>"· "+esc(l.text)).join("<br>")}</div>`:""}
      <textarea class="note" style="margin-top:6px;min-height:40px;" placeholder="这天的一句话" onchange="save('journal/${d}/note',this.value.trim())">${esc(j.note||"")}</textarea>
      ${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${p}" onclick="viewPhoto(this.src)">`).join("")}</div>`:""}</div>`; }).join("")+`</div>`;
  h+=`<div class="dbtns" style="justify-content:center;"><button class="pbtn hot" onclick="exportArchive()">${ic("save")} 导出档案(HTML)</button><button class="pbtn" onclick="exportArchiveJSON()">导出数据(JSON)</button></div>`;
  $("#view").innerHTML=h;
}
function addJournalPhoto(d){ window._jDay=d; $("#noteInput").click(); }
$("#noteInput").addEventListener("change", async ev=>{ const f=ev.target.files[0]; ev.target.value=""; if(!f||!window._jDay) return; const b=await compressImage(f,1200,0.65); push("journal/"+window._jDay+"/photos",b); toast("照片已保存 ✓"); });
function exportArchive(){
  const byCity=archiveData(), ex=expList(), co=ex.filter(isCo), logs=Object.values(S.log||{}), jr=S.journal||{};
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(S.trip.title)} · 行程档案</title><style>${DOC_CSS} img{max-width:180px;border-radius:6px;margin:4px;}</style></head><body>
  <h1>${esc(S.trip.title)} · 行程档案</h1><p>${esc(S.trip.start)} 至 ${esc(S.trip.end)} · ${esc(S.trip.city||"")}<br>公司 ${c$(sumBy(co,companyCAD))} · 私人 ${c$(sumBy(ex,personalCAD))} · 未对账 ${ex.filter(needsPaid).length} 笔 · 缺票据 ${co.filter(e=>!e.receipt&&!e.noReceipt).length} 笔</p>
  ${Object.entries(byCity).map(([c,l])=>`<h2>${esc(c)}</h2><table>${l.map(x=>{ const o=x.o; return `<tr><td>${x.t==="hotel"?"住宿":KIND[o.kind].label}</td><td><b>${esc(o.name||o.title)}</b>${o.nameLocal?`<div class="s">${esc(o.nameLocal)}</div>`:""}</td><td>${x.t==="hotel"?o.checkIn+" → "+o.checkOut:o.date}</td><td>${"★".repeat(+o.rating||0)}</td><td>${esc(o.review||"")}</td><td class="s">${esc(o.localAddress||"")}</td></tr>`; }).join("")}</table>`).join("")}
  <h2>每天</h2>${tripDays().map(d=>{ const j=jr[d]||{}; const lg=logs.filter(l=>l.date===d); return `<p><b>${d}</b> ${esc(dayCities(d).join(" → "))}${j.note?`<br>${esc(j.note)}`:""}${lg.length?`<br><span class="s">${lg.map(l=>esc(l.text)).join(" · ")}</span>`:""}<br>${Object.values(j.photos||{}).map(p=>`<img src="${p}">`).join("")}</p>`; }).join("")}
  </body></html>`;
  dl(new Blob([html],{type:"text/html"}),fileStem()+"-行程档案.html");
}
function exportArchiveJSON(){
  const d=clone(S); Object.values(d.expenses||{}).forEach(e=>delete e.receipt); [d.events,d.hotels].forEach(c=>Object.values(c||{}).forEach(x=>delete x.docs)); delete d.journal;
  dl(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}),fileStem()+"-档案数据.json");
}

/* ---- 备份 ---- */
function backupSheet(){
  const lb=+localStorage.getItem("jt_lastBackup")||0;
  sheet(`<h3>${ic("save")} 备份与恢复</h3>
    <div class="hint blue">App 已经自动把数据存在这台手机上(没网也能打开)。下载备份是再多一层保险:万一云端或手机出问题,用它能恢复全部行程、花费和票据。</div>
    <div class="muted" style="margin-bottom:12px;">上次下载:${lb?new Date(lb).toLocaleString():"从未"} · 本机待上传 ${OUTBOX.length} 条</div>
    <button class="btn dark full" onclick="backupDownload()">下载备份(JSON)</button>
    <button class="btn ghost full" style="margin-top:10px;" onclick="backupRestore()">从备份恢复…</button>`);
}

/* ---- 翻译 ---- */
function curLangList(){ return (S&&S.trip&&S.trip.langs&&S.trip.langs.length)?S.trip.langs:Object.keys(LANGS); }
function trLangNow(){ const ls=curLangList(); return window._trLang&&ls.includes(window._trLang)?window._trLang:(ls.includes(defaultLang())?defaultLang():ls[0]); }
function trSheet(){
  const langs=curLangList(), lang=trLangNow(), d=window._trDir||"cj", L=(LANGS[lang]&&LANGS[lang].label)||lang, ph=(LANGS[lang]&&LANGS[lang].phrases)||[];
  sheet(`<h3>${ic("trans")} 翻译</h3>
  ${langs.length>1?`<div class="seg mini" style="margin-bottom:8px;">${langs.map(l=>`<button class="${l===lang?"on":""}" onclick="window._trLang='${l}';trSheet()">${LANGS[l].label}</button>`).join("")}</div>`:""}
  <div class="seg mini" style="margin-bottom:10px;"><button class="${d==="cj"?"on":""}" onclick="window._trDir='cj';trSheet()">中 → ${L}</button><button class="${d==="jc"?"on":""}" onclick="window._trDir='jc';trSheet()">${L} → 中</button></div>
  <div class="f"><textarea id="tr_in" rows="3" placeholder="${d==="cj"?"输入中文,或点键盘上的麦克风说话":"输入/粘贴"+L}"></textarea></div>
  <button class="btn indigo full" onclick="trDo()">翻译</button><div id="tr_out" style="margin-top:10px;"></div>
  <div class="muted" style="margin:14px 0 6px;">常用句(点一下大字显示并朗读,没网也能用)</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;">${ph.map((p,i)=>`<button class="chip" onclick="trPhrase(${i})">${p[0]}</button>`).join("")}</div>
  <button class="btn ghost full" style="margin-top:14px;" onclick="$('#trPhoto').click()">${ic("cam")} 拍菜单 / 成分标签翻译</button><div id="tr_photo_out" style="margin-top:8px;"></div>`);
}
function trShowLocal(loc,cn,lang){
  $("#tr_out").innerHTML=`<div style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;"><div style="font-family:var(--disp);font-size:22px;line-height:1.5;">${esc(loc)}</div>${cn?`<div class="muted" style="margin-top:4px;">${esc(cn)}</div>`:""}
    <div class="btns" style="margin-top:10px;"><button class="btn indigo" onclick="speakLocal('${q(loc)}','${lang}')">${ic("sound")} 朗读</button><button class="btn ghost" onclick="copyText('${q(loc)}')">复制</button></div></div>`;
}
function trPhrase(i){ const lang=trLangNow(); const p=(LANGS[lang].phrases||[])[i]; if(!p) return; trShowLocal(p[1],p[0],lang); speakLocal(p[1],lang); }
async function trDo(){
  const txt=$("#tr_in").value.trim(); if(!txt){ toast("先输入内容"); return; } const lang=trLangNow(), L=LANGS[lang].label, d=window._trDir||"cj";
  $("#tr_out").innerHTML=`<div class="muted">翻译中…</div>`;
  try{ const out=await askClaude((d==="cj"?`把下面的中文翻译成自然、礼貌的${L}口语,适合旅行者当面使用。只返回${L}译文:\n`:`把下面的${L}翻译成简体中文,只返回译文:\n`)+txt,400);
    if(d==="cj"){ trShowLocal(out,"",lang); speakLocal(out,lang); } else $("#tr_out").innerHTML=`<div style="background:var(--paper);border-radius:12px;padding:14px;font-size:15px;line-height:1.7;">${esc(out)}</div>`;
  }catch(e){ $("#tr_out").innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
}
$("#trPhoto").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return; $("#tr_photo_out").innerHTML=`<div class="muted">识别翻译中…</div>`;
  try{ const b64=await compressImage(f,1100,0.72);
    const out=await askClaude([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64.split(",")[1]}},{type:"text",text:"这是旅行中拍的菜单/商品标签/说明。用简体中文:1)翻译主要内容;2)如是食品,标出关键原料与常见过敏原;3)一句点单或购买建议。简洁分点。"}],900);
    $("#tr_photo_out").innerHTML=`<div style="background:var(--paper);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-line;">${esc(out)}</div>`;
  }catch(e){ $("#tr_photo_out").innerHTML=`<div class="hint">${esc(e.message)}</div>`; }
});

/* ---- 设置 ---- */
function openSettings(){
  const key=localStorage.getItem("jt_apikey")||"", T=S.trip||{}, manual=T.rateManual||{};
  sheet(`<h3>${ic("gear")} 设置</h3>
    <div class="f"><label>Claude API key(只存这台手机;收据识别、翻译、导入预订、体检要用)</label><input id="st_key" type="password" value="${esc(key)}" placeholder="sk-ant-..."></div>
    <div class="f"><label>导航默认用</label><select id="st_map"><option value="google" ${mapApp()==="google"?"selected":""}>Google 地图</option><option value="apple" ${mapApp()==="apple"?"selected":""}>Apple 地图</option></select></div>
    <div class="fs-h">报销</div>
    ${fld("出行人(报销单抬头)","st_trav",T.traveler)}
    <div class="f"><label>出差目的(出差行程单 / 报销单)</label><textarea id="st_purp" rows="2">${esc(T.purpose||"")}</textarea></div>
    <div class="f-row"><div class="f"><label>出差期 · 开始</label><input id="st_bs" type="date" value="${esc(T.bizStart||"")}"></div><div class="f"><label>结束</label><input id="st_be" type="date" value="${esc(T.bizEnd||"")}"></div></div>
    <div class="muted" style="margin:-6px 0 12px;">出差期只是默认建议;关联了行程或住宿的花费,跟着那一项的归属走。</div>
    ${curList().filter(c=>c!=="CAD").map(c=>`<div class="f"><label>手动汇率 1 ${c} = C$?(空着用实时 ${(liveRates[c]||DEFAULT_RATES[c]).toFixed(c==="USD"?4:5)})</label><input id="st_rate_${c}" type="number" step="any" value="${manual[c]||""}"></div>`).join("")}
    <div class="btns"><button class="btn indigo" onclick="saveSettings()">保存</button></div>
    <div class="fs-h">数据</div>
    <div class="muted" style="margin-bottom:10px;">${esc(BUILD)}${SHELL?" · 空壳版":""} · 节点 ${esc(NODE)} · 本机待上传 ${OUTBOX.length} 条</div>
    <button class="btn ghost full" onclick="backupSheet()">备份与恢复</button>
    ${SHELL?"":`<button class="btn ghost full" style="margin-top:8px;" onclick="forceSync()">同步初始数据到云端(保留花费/清单)</button>
    <button class="btn ghost full" style="margin-top:8px;color:var(--danger)" onclick="if(confirm('清空全部数据并恢复初始行程?不可撤销'))resetAll()">重置全部数据</button>`}`);
}
function saveSettings(){
  const k=$("#st_key").value.trim(); if(k) localStorage.setItem("jt_apikey",k); else localStorage.removeItem("jt_apikey");
  localStorage.setItem("jt_mapapp",$("#st_map").value);
  const manual={}; curList().filter(c=>c!=="CAD").forEach(c=>{ const v=parseFloat($("#st_rate_"+c).value); if(!isNaN(v)) manual[c]=v; });
  if(!LOCAL){ patch("trip",{ rateManual:Object.keys(manual).length?manual:null, traveler:$("#st_trav").value.trim()||null, purpose:$("#st_purp").value.trim()||null, bizStart:$("#st_bs").value||null, bizEnd:$("#st_be").value||null }); }
  else toast("预览模式:行程设置不会保存(API key 已存本机)");
  closeSheet(); toast("设置已保存 ✓");
}

/* ================= 启动 ================= */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
renderTabs();
boot();
fetchRates();
setTimeout(fetchWeather,800);
setInterval(()=>{ if(S&&(tab==="today"||tab==="plan")&&!$("#modalRoot").innerHTML&&document.activeElement.tagName!=="INPUT") render(); },60000);
if("speechSynthesis" in window) speechSynthesis.getVoices();

</script>
