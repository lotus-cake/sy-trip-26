<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日韩行">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#F6F4EF">
<title>日韩行 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#1F2228; --sub:#6B6F78; --faint:#A3A6AD;
  --line:#E6E3DB; --line2:#D6D2C6; --soft:#EFEDE7;
  --indigo:#2E4A6B; --indigo-bg:#E9EFF6; --indigo-dk:#1E3450;
  --blue:#2F6FD6; --blue-bg:#E6EFFC;
  --teal:#2F6B57; --teal-bg:#E3F0E8; --teal-dk:#1E4A3C;
  --purple:#5A4B8A; --purple-bg:#ECE8F6;
  --persim:#B65C38; --persim-bg:#F8EAE2; --persim-dk:#8A4225;
  --amber:#B8860B; --amber-bg:#F6EDD6; --amber-dk:#6B4E0E;
  --danger:#C0392B; --danger-bg:#FBE7E4;
  --disp:'Shippori Mincho',serif;
  --body:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','PingFang SC',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;}
#app{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
.hidden{display:none !important;}
svg.i{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.14em; flex:0 0 auto;}
button{font-family:var(--body);}

header.top{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px;}
header.top .brand{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.06em; display:flex; align-items:center; gap:8px;}
.seal{width:24px; height:24px; background:#B03A2E; color:#FBF6EF; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--disp); font-size:13px; font-weight:600; transform:rotate(-4deg);}
.conn{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--sub); padding:3px 9px; border-radius:999px; background:var(--soft);}
.conn .cdot{width:7px; height:7px; border-radius:50%; background:#C9A227;}
.conn.on .cdot{background:#2F8A5B;}
.conn.warn{background:var(--amber-bg); color:var(--amber-dk);}
.conn.off{background:var(--danger-bg); color:var(--danger);} .conn.off .cdot{background:var(--danger);}
header.top .gear{background:none; border:none; color:var(--sub); font-size:20px; padding:6px; cursor:pointer;}
.page{padding:4px 16px 24px;}

/* chips */
.chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--ink); white-space:nowrap; font-weight:500; line-height:1.5;}
.chip.blue{background:var(--blue-bg); color:var(--blue);} .chip.green{background:var(--teal-bg); color:var(--teal-dk);}
.chip.amber{background:var(--amber-bg); color:var(--amber-dk);} .chip.red{background:var(--danger-bg); color:var(--danger);}
.chip.persim{background:var(--persim-bg); color:var(--persim-dk);} .chip.lg{font-size:13px; padding:5px 13px;}

/* today */
.td-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin:8px 2px 14px;}
.eyebrow{font-size:12.5px; color:var(--sub);}
.bigdate{font-size:27px; font-weight:700; line-height:1.3; margin-top:2px;}
.route{font-size:13.5px; color:var(--sub); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px;}
.ph{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13.5px; color:var(--sub); margin-bottom:8px;}
.p-title{font-size:21px; font-weight:700; line-height:1.35;}
.p-sub{font-size:14px; color:var(--sub); margin-top:4px;}
.p-meta{font-size:13px; color:var(--sub); margin-top:3px;}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.cols .cl{font-size:12.5px; color:var(--sub);} .cols .cv{font-size:21px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;} .cols .cp{font-size:13px; color:var(--sub); margin-top:4px;}
.countdown{margin-top:12px; font-size:13.5px; font-weight:500; color:var(--indigo); display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.countdown.soon{color:var(--persim-dk);}
.pre-leg{margin-top:8px; font-size:13.5px; color:var(--sub); line-height:1.6;}
.hr{height:1px; background:var(--line); margin:14px 0;}
.night{display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer;}
.night .i{font-size:20px; color:var(--sub);}
.night small{display:block; font-size:12.5px; color:var(--sub);}
.qa{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.qa button{background:var(--card); border:1px solid var(--line2); border-radius:12px; padding:12px 6px 10px; font-size:13.5px; font-weight:500; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
.qa button .i{font-size:19px;}
.sec-h{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:18px 2px 8px;}
.sec-h h2{font-size:18px; font-weight:700; margin:0;}
.sec-h .lnk{font-size:13px; color:var(--indigo); cursor:pointer; background:none; border:none; padding:4px 0;}
.rowlist{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:2px 14px; margin-bottom:14px;}
.rowlist .row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); cursor:pointer;}
.rowlist .row:first-child{border-top:none;}
.row .ri{font-size:21px; flex:0 0 auto; color:var(--faint);} .row .ri.red{color:var(--danger);} .row .ri.amber{color:var(--amber);} .row .ri.green{color:var(--teal);} .row .ri.blue{color:var(--blue);}
.row .rm{flex:1; min-width:0;} .row .rt{font-size:15px; font-weight:500; line-height:1.4;} .row .rs{font-size:12.5px; color:var(--sub); margin-top:1px;}
.row .rc{color:var(--faint); font-size:18px;}
.row.done .rt{color:var(--faint); text-decoration:line-through;}
.empty{color:var(--faint); text-align:center; padding:28px 0; font-size:14px;}
.muted{color:var(--faint); font-size:12.5px;}

/* day pills */
.day-pills{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none;}
.day-pills::-webkit-scrollbar{display:none;}
.pill{position:relative; flex:0 0 auto; border:1px solid var(--line2); background:var(--card); color:var(--sub); border-radius:16px; padding:6px 12px; font-size:13px; cursor:pointer; text-align:center; line-height:1.25;}
.pill b{display:block; font-size:13px; font-weight:500; color:inherit;}
.pill small{font-size:10.5px; opacity:.8;}
.pill.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.pill .pdot{position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%; background:var(--amber);}
.pill .pdot.red{background:var(--danger);}
.pill .tdot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--danger); margin-left:3px; vertical-align:2px;}
.day-h{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 2px 4px;}
.day-h .dt{font-size:15px; font-weight:700;}
.day-h2{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); margin:0 2px 12px; cursor:pointer;}

/* timeline */
.tl-row{display:grid; grid-template-columns:48px 1fr; gap:10px; margin-bottom:10px;}
.tl-t{font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums; padding-top:13px;}
.tl-t small{display:block; font-size:11px; color:var(--faint);}
.tl-row.past .ev, .tl-row.past .tr{opacity:.55;}
.now-line{display:flex; align-items:center; gap:8px; margin:2px 0 10px 4px; color:var(--danger); font-size:11.5px; font-weight:700;}
.now-line:after{content:""; flex:1; height:1.5px; background:var(--danger); opacity:.55;}
.ev{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; border-left-width:4px;}
.ev.k-flight,.ev.k-train{border-left-color:var(--indigo);} .ev.k-hotel{border-left-color:var(--teal);} .ev.k-food{border-left-color:var(--persim);}
.ev.k-work{border-left-color:var(--purple);} .ev.k-activity{border-left-color:var(--amber);}
.ev-top{padding:12px 14px 2px; cursor:pointer;}
.ev-title{font-size:16.5px; font-weight:700; line-height:1.35; display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.ev-sub{font-size:14px; color:var(--sub); margin-top:3px;}
.ev-meta{font-size:12.5px; color:var(--sub); margin-top:3px;}
.ev-route{display:flex; align-items:center; gap:10px; margin-top:8px; font-variant-numeric:tabular-nums;}
.ev-route .st b{font-size:16px; font-weight:700;} .ev-route .st small{font-size:11.5px; color:var(--sub); display:block;}
.ev-route .arrow{color:var(--faint);}
.ev-acts{display:flex; border-top:1px solid var(--line); margin-top:10px;}
.ev-acts button{flex:1; background:none; border:none; border-left:1px solid var(--line); padding:9px 4px 8px; font-size:12.5px; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
.ev-acts button:first-child{border-left:none;}
.ev-acts button .i{font-size:17px;}
.ev-acts button.cta{color:var(--amber-dk); font-weight:700; background:var(--amber-bg);}
.ev-more{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding:9px 14px; font-size:13px; color:var(--sub); cursor:pointer;}
.ev-detail{padding:2px 14px 14px; font-size:13.5px; line-height:1.65;}
.ev-detail .note{white-space:pre-line; margin-top:6px;}
.kv{display:flex; gap:8px; margin-top:7px; align-items:flex-start;} .kv .k{flex:0 0 58px; color:var(--sub); font-size:12.5px; padding-top:1px;} .kv .v{flex:1; min-width:0; word-break:break-word;}
.mini{background:var(--paper); border:1px solid var(--line2); border-radius:8px; padding:3px 9px; font-size:12px; color:var(--ink); cursor:pointer; margin:2px 4px 0 0; display:inline-flex; align-items:center; gap:4px;}
.dbtns{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.pbtn{border:1px solid var(--line2); background:var(--paper); border-radius:9px; padding:7px 11px; font-size:12.5px; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
.pbtn.hot{border-color:var(--indigo); color:var(--indigo); font-weight:500;}
.pbtn.warn{border-color:var(--amber); color:var(--amber-dk); background:var(--amber-bg); font-weight:500;}
.tr{padding:8px 2px 2px 12px; border-left:2px dashed var(--line2);}
.tr b{font-size:15px; font-weight:700;} .tr .sub{font-size:13px; color:var(--sub); margin-top:1px;}
.tr .links{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px;}
.tr .lnk{display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--ink); cursor:pointer;}
.tr .lnk .i{color:var(--sub);}
.buf{margin:-4px 0 10px 58px;}
.buf span{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 10px; border-radius:8px;}
.buf .ok{color:var(--sub); background:var(--soft);} .buf .warn{color:var(--amber-dk); background:var(--amber-bg);} .buf .bad{color:#fff; background:var(--danger);}
.arrm{padding:11px 12px; font-size:13.5px; color:var(--indigo-dk); background:var(--indigo-bg); border-radius:12px; cursor:pointer;}
.stars{display:inline-flex; gap:1px;} .stars button{background:none; border:none; font-size:21px; color:var(--line2); padding:0 1px; cursor:pointer; line-height:1;} .stars button.on{color:#D9A520;}
.docs-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
.docs-grid .doc{position:relative;} .docs-grid img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
.docs-grid .doc .del{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border-radius:50%; width:24px; height:24px; padding:0; font-size:12px;}
.thumbs{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;} .thumbs img{width:56px; height:56px; object-fit:cover; border-radius:7px; border:1px solid var(--line); cursor:pointer;}
.bigconf{font-size:30px; font-weight:700; letter-spacing:.04em; text-align:center; padding:16px 8px; background:var(--paper); border-radius:14px; margin:8px 0 12px; word-break:break-all;}

/* map */
.stop{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start;}
.stop:first-child{border-top:none;}
.stop .num{width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:2px;}
.stop .num.h{background:var(--teal);}
.stop .sm{flex:1; min-width:0;} .stop .sn{font-size:15px; font-weight:500;} .stop .ss{font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.leg{margin:-2px 0 0 38px; padding:2px 0 10px;}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.fchip{flex:0 0 auto; border:1px solid var(--line2); background:var(--card); color:var(--sub); border-radius:16px; padding:5px 13px; font-size:13px; cursor:pointer;}
.fchip.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.place{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 15px; margin-bottom:10px;}
.place .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.place .nm{font-size:15.5px; font-weight:500; line-height:1.35;}
.place .cat{font-size:11.5px; color:var(--sub); margin-top:1px;}
.place .dist{font-size:12.5px; color:var(--indigo); font-weight:500; white-space:nowrap;}
.place .p-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
textarea.note{width:100%; border:1px solid var(--line2); border-radius:10px; padding:9px 11px; font-family:var(--body); font-size:14px; min-height:64px; background:#FDFCFA; color:var(--ink); resize:vertical;}

/* money */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.stat.wide{grid-column:1 / -1;}
.stat .lb{font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px;}
.stat .big{font-size:21px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}
.stat .sm{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5;}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
.dot.b{background:var(--teal);} .dot.p{background:var(--persim);} .dot.a{background:var(--indigo);}
.flow{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:10px; cursor:pointer;}
.flow .fs{display:flex; gap:4px; margin-top:6px;} .flow .fs span{flex:1; height:5px; border-radius:3px; background:var(--soft);} .flow .fs span.ok{background:var(--teal);} .flow .fs span.todo{background:var(--amber);}
.quick{display:flex; gap:8px; margin:12px 0 6px;}
.quick input,.quick select{flex:1; min-width:0; border:1px solid var(--line2); border-radius:10px; padding:10px 10px; font-size:16px; font-family:var(--body); background:var(--card); color:var(--ink);}
.btn{border:none; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn.b{background:var(--teal); color:#fff;} .btn.p{background:var(--persim); color:#fff;}
.btn.ghost{background:var(--card); border:1px solid var(--line2); color:var(--ink);}
.btn.full{width:100%; padding:12px;} .btn.indigo{background:var(--indigo); color:#fff;} .btn.dark{background:var(--ink); color:#fff;}
.btn:disabled{opacity:.5;}
.exp-item{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line);}
.exp-item .thumb{width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--line); flex:0 0 auto;}
.exp-item .thumb-ph{width:40px; height:40px; border-radius:8px; background:var(--card); border:1px dashed var(--line2); display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:12px; flex:0 0 auto;}
.exp-item .mid{flex:1; min-width:0; cursor:pointer;}
.exp-item .m1{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.exp-item .m2{font-size:12px; color:var(--sub); display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:2px;}
.exp-item .amt{text-align:right; font-variant-numeric:tabular-nums; cursor:pointer;}
.exp-item .amt .y{font-weight:500; font-size:14.5px;} .exp-item .amt .c{font-size:11.5px; color:var(--sub);}
.tag{font-size:10.5px; padding:1px 7px; border-radius:8px; font-weight:500; white-space:nowrap;}
.tag.b{background:var(--teal-bg); color:var(--teal-dk);} .tag.p{background:var(--persim-bg); color:var(--persim-dk);}
.tag.w{background:var(--amber-bg); color:var(--amber-dk);} .tag.r{background:var(--danger-bg); color:var(--danger);} .tag.g{background:var(--soft); color:var(--sub);}
.rec-row{display:flex; gap:6px; margin:0 0 10px 50px;} .rec-row input{flex:1; min-width:0; border:1px solid var(--line2); border-radius:9px; padding:8px 10px; font-size:15px;}
.cat-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 13px 4px; margin-top:12px;}
.cat-card .hd{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); padding:6px 0 2px;}
.cat-row{display:flex; align-items:center; gap:9px; padding:7px 0; font-size:13.5px; cursor:pointer; border-top:1px solid var(--line);}
.cat-row .cn{flex:0 0 92px; white-space:nowrap;} .cat-row .bar{flex:1; height:6px; background:var(--paper); border-radius:3px; overflow:hidden;} .cat-row .bar i{display:block; height:100%; border-radius:3px;}
.cat-row .ca{flex:0 0 auto; min-width:84px; text-align:right; font-variant-numeric:tabular-nums;} .cat-row .ca small{display:block; font-size:10.5px; color:var(--faint);}
.cat-row.on .cn{font-weight:700; color:var(--indigo);} .cat-row.dim{opacity:.42;}
.grp-hd{display:flex; justify-content:space-between; align-items:baseline; margin:16px 2px 2px;} .grp-hd .gt{font-size:13.5px; font-weight:700;}
.seg{display:flex; gap:8px;}
.seg button{flex:1; border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:9px; font-size:14px; color:var(--sub); cursor:pointer;}
.seg button.on{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:500;}
.seg button.on.b{background:var(--teal); border-color:var(--teal);} .seg button.on.p{background:var(--persim); border-color:var(--persim);} .seg button.on.m{background:var(--indigo); border-color:var(--indigo);}
.seg.mini button{padding:7px; font-size:13px;}
.step{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px;}
.step .sh{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px;}
.step .sn{width:24px; height:24px; border-radius:50%; background:var(--amber-bg); color:var(--amber-dk); font-size:13px; display:flex; align-items:center; justify-content:center;}
.step .sn.ok{background:var(--teal); color:#fff;}
.step .sd{font-size:12.5px; color:var(--sub); margin:2px 0 4px 34px;}

/* tools */
.tools{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tool{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; text-align:left; cursor:pointer; color:var(--ink); position:relative;}
.tool .i{font-size:22px; color:var(--indigo);} .tool b{display:block; font-size:15px; margin-top:8px;} .tool small{display:block; font-size:12px; color:var(--sub); margin-top:2px;}
.tool .cnt{position:absolute; top:12px; right:12px;}

/* ================= 时间与时区 =================
   每个事件都带自己的时区:tz(出发/开始)、endTz(到达/结束)。跨时区航班不会算错日期。
   模拟某个时刻测试:网址加 ?now=2026-10-22T09:00&tz=America/Vancouver                      */
function tzOffsetMin(tz, epoch){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(epoch));
  const g=t=>+p.find(x=>x.type===t).value;
  return (Date.UTC(g("year"),g("month")-1,g("day"),g("hour")%24,g("minute"),g("second"))-Math.floor(epoch/1000)*1000)/60000;
}
function zEpoch(date,time,tz){
  if(!date) return 0; tz=tz||TZ;
  const [y,m,d]=date.split("-").map(Number); const [hh,mm]=(time||"00:00").split(":").map(Number);
  const guess=Date.UTC(y,m-1,d,hh||0,mm||0); const off=tzOffsetMin(tz,guess); let ep=guess-off*60000;
  const off2=tzOffsetMin(tz,ep); if(off2!==off) ep=guess-off2*60000; return ep;
}
function zParts(epoch,tz){
  const s=new Intl.DateTimeFormat("sv-SE",{timeZone:tz||TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(epoch));
  return { date:s.slice(0,10), time:s.slice(11,16) };
}
const URLP=new URLSearchParams(location.search);
const SIM=(()=>{ const n=URLP.get("now"); if(!n) return null; const [d,t]=n.split("T"); return { ep:zEpoch(d,t||"09:00",URLP.get("tz")||TZ), at:Date.now() }; })();
function NOW(){ return SIM ? SIM.ep+(Date.now()-SIM.at) : Date.now(); }
function tzName(tz){ return TZ_LABEL[tz] || (tz||"").split("/").pop().replace(/_/g," "); }
function dstr(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+m}/${+dd}`; }
function dlong(d){ const [y,m,dd]=d.split("-"); return `${+m}月${+dd}日`; }
function weekday(d){ return ["日","一","二","三","四","五","六"][new Date(d+"T12:00:00Z").getUTCDay()]; }
function addDays(d,n){ const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/86400000); }
function fmtDur(min){ min=Math.max(0,Math.round(min)); const d=Math.floor(min/1440), h=Math.floor(min%1440/60), m=min%60;
  if(d) return `${d} 天 ${h} 小时`; if(h) return `${h} 小时 ${String(m).padStart(2,"0")} 分钟`; return `${m} 分钟`; }
function hm(ep,tz){ return zParts(ep,tz).time; }

/* ================= 本机缓存(IndexedDB) =================
   - snap:最近一次完整数据(含本机未上传的修改)→ 没网也能打开、看机票
   - outbox:还没确认写进云端的修改 → 刷新/关掉 App 也不会丢,有网后自动补传          */
const IDB_NAME="tripcache-"+NODE;
let _idb=null;
function idb(){ if(_idb) return _idb; _idb=new Promise((res,rej)=>{ try{ const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return _idb; }
async function idbGet(k){ try{ const d=await idb(); return await new Promise((res,rej)=>{ const r=d.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
let _snapTimer=null;
function persistSnap(){ clearTimeout(_snapTimer); _snapTimer=setTimeout(()=>{ if(S&&!LOCAL) idbSet("snap",{v:S,ts:SNAP_TS||Date.now()}); },250); }
function persistOutbox(){ idbSet("outbox",OUTBOX); }

function getPath(obj,path){ let cur=obj; for(const p of path.split("/")){ if(cur==null) return undefined; cur=cur[p]; } return cur; }
function applyOp(op){ if(op.path==="") S=clone(op.val); else setPath(S,op.path,op.val); }
function setPath(obj,path,val){
  const ps=path.split("/"); let cur=obj;
  for(let i=0;i<ps.length-1;i++){ if(cur[ps[i]]==null||typeof cur[ps[i]]!=="object") cur[ps[i]]={}; cur=cur[ps[i]]; }
  const k=ps[ps.length-1];
  if(val===null||val===undefined) { if(Array.isArray(cur)) cur[k]=null; else delete cur[k]; } else cur[k]=clone(val);
}

let fb=null, db=null;

function setConn(){
  const b=$("#connBadge"); if(!b) return;
  const n=OUTBOX.length; let cls="conn", t;
  if(LOCAL){ cls+=" off"; t="预览 · 不保存"; }
  else if(FB_DENIED){ cls+=" off"; t="云端拒绝"+(n?` · ${n} 条待上传`:""); }
  else if(CONNECTED){ if(n){ cls+=" warn"; t=`上传中 ${n}`; } else { cls+=" on"; t="云端同步"; } }
  else { cls+=" warn"; const ts=SNAP_TS?new Date(SNAP_TS).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):""; t=`离线${ts?" · 缓存 "+ts:""}${n?` · ${n} 条待上传`:""}`; }
  b.className=cls; b.querySelector(".t").textContent=t;
}
function sendOp(op){
  if(!db) return;
  (op.path===""?db:db.child(op.path)).set(op.val===undefined?null:op.val).then(()=>{
    OUTBOX=OUTBOX.filter(o=>o.id!==op.id); persistOutbox(); setConn();
  }).catch(err=>{ FB_DENIED=true; setConn(); toast("云端写入被拒:"+(err&&err.code||err)+" · 修改已存本机",5000); });
}
/* 所有修改都走这里:先改本机、存缓存和待上传队列,再发云端 */
function write(path,val){
  if(LOCAL){ toast("预览模式:修改不会保存"); return false; }
  if(!S) return false;
  setPath(S,path,val);
  const op={ id:uid(), path, val:val===undefined?null:clone(val), ts:Date.now() };
  OUTBOX.push(op); persistOutbox(); persistSnap(); setConn(); render();
  sendOp(op); return true;
}
function save(path,val){ return write(path,val); }
function del(path){ return write(path,null); }
function push(path,val){ const id=uid(); return write(path+"/"+id,val)?id:null; }
function patch(path,obj){ for(const k in obj) write(path+"/"+k, obj[k]); }

function adoptServer(v){
  S=v; for(const op of OUTBOX) applyOp(op);   // 还没上传的修改叠在云端数据上,界面不会"回退"
  SNAP_TS=Date.now(); FROM_CACHE=false; LOCAL=false;
  if(S.trip&&S.trip.title) $("#brandTitle").textContent=S.trip.title;
  persistSnap(); setConn(); render();
}
function migrate(v){
  // 新版种子:保留用户的花费、清单勾选、本机新增条目、凭证、评分、手动改过的事件
  const keepUser=(seedCol,userCol,fields)=>{ const out=clone(seedCol)||{}; const u=userCol||{};
    for(const id in u){ if(id[0]==="k"||u[id].edited) out[id]=u[id]; else if(out[id]) fields.forEach(f=>{ if(u[id][f]!=null) out[id][f]=u[id][f]; }); }
    return out; };
  const keep=["docs","rating","review","photos","status","conf","done","doneTs"];
  const m=clone(SEED);
  m.events=keepUser(SEED.events,v.events,keep);
  m.hotels=keepUser(SEED.hotels,v.hotels,keep);
  m.tasks=keepUser(SEED.tasks,v.tasks,keep);
  m.places={...clone(SEED.places||{}),...(v.places||{})};
  m.expenses={...clone(SEED.expenses||{}),...(v.expenses||{})};
  ["journal","log"].forEach(k=>{ if(v[k]) m[k]=v[k]; });
  ["traveler","purpose","rateManual","bizStart","bizEnd"].forEach(k=>{ if(v.trip&&v.trip[k]) m.trip[k]=v.trip[k]; });
  db.set(m).then(()=>toast("行程数据已更新到 v"+SEED.trip.seedVersion+" ✓"))
    .catch(err=>{ FB_DENIED=true; setConn(); toast("云端写入失败:"+(err&&err.code||err)+" · 请检查 Firebase 规则",6000); });
}
function forceSync(){ if(SHELL){ toast("空壳版不能同步初始数据",4000); return; } if(!db||!CONNECTED){ toast("需要联网"); return; } db.once("value").then(s=>{ migrate(s.val()||{}); closeSheet(); }); }
function resetAll(){ if(SHELL||!db){ toast("空壳版不能重置"); return; } db.set(null); OUTBOX=[]; persistOutbox(); toast("已重置"); closeSheet(); }

async function boot(){
  const [snap,ob]=await Promise.all([idbGet("snap"),idbGet("outbox")]);
  OUTBOX=Array.isArray(ob)?ob:[];
  if(snap&&snap.v&&!S){ S=snap.v; SNAP_TS=snap.ts||0; FROM_CACHE=true; for(const op of OUTBOX) applyOp(op);
    if(S.trip&&S.trip.title) $("#brandTitle").textContent=S.trip.title; setConn(); render(); }
  if(!db){ if(!S) goLocal(SHELL?"没有网络,本机也没有缓存。请先联网打开一次。":"Firebase 脚本未加载 · 本地预览"); return; }
  for(const op of OUTBOX) sendOp(op);   // 上次没传完的修改,继续补传
  fb.ref(".info/connected").on("value",s=>{ CONNECTED=!!s.val(); setConn(); });
  db.on("value", snap=>{
    const v=snap.val();
    if(!v){ if(SHELL){ if(!S) goLocal("云端还没有这趟的数据 · 请先部署完整版"); return; } db.set(SEED); return; }
    if(!SHELL && v.trip && (v.trip.seedVersion||0) < SEED.trip.seedVersion){ migrate(v); return; }
    FB_DENIED=false; adoptServer(v);
  }, err=>{ FB_DENIED=true; setConn(); if(!S) goLocal("云端拒绝访问(Firebase 规则未开放 "+NODE+")"); toast("Firebase:"+(err&&err.code||err),5000); });
  setTimeout(()=>{ if(!S) goLocal(SHELL?"连不上云端,本机也没有缓存":"连不上云端 · 先用初始数据预览"); }, 6000);
}
function goLocal(msg){
  if(S) return;
  if(SHELL){ EMPTY_MSG=msg; LOCAL=true; setConn(); render(); return; }
  LOCAL=true; S=clone(SEED); setConn(); render(); setTimeout(()=>toast(msg,3500),400);
}

  flight:  { label:"航班", icon:"plane", cls:"k-flight" },
  train:   { label:"列车", icon:"train", cls:"k-train" },
  transit: { label:"移动", icon:"taxi",  cls:"k-transit" },

const STATUS = { booked:["已订","green"], todo:["待订","amber"], suggested:["建议","blue"], tbc:["待确认","amber"] };

function evStart(e){ return zEpoch(e.date,e.time,e.tz||TZ); }
function evEnd(e){
  if(e.endTime) return zEpoch(e.endDate||e.date,e.endTime,e.endTz||e.tz||TZ);
  if(e.kind==="transit") return evStart(e)+(+e.durMax||+e.durMin||0)*60000;
  return evStart(e);
}
let _evCache=null;
function evList(){
  if(_evCache) return _evCache;
  const out=Object.entries((S&&S.events)||{}).filter(([id,e])=>e&&e.date).map(([id,e])=>{ const x={...e,id}; x._s=evStart(x); x._e=evEnd(x); return x; })
    .sort((a,b)=>a._s-b._s || (a.kind==="transit"?-1:0)-(b.kind==="transit"?-1:0));
  _evCache=out; return out;
}
function invalidate(){ _evCache=null; _bufCache=null; }
function evOn(date){ return evList().filter(e=>e.date===date); }
function arrivalsOn(date){ return evList().filter(e=>(e.kind==="flight"||e.kind==="train")&&e.endDate&&e.endDate!==e.date&&e.endDate===date); }
function isImportant(e){ return e.kind!=="transit" || !!e.fixed; }
function ev(id){ const e=(S.events||{})[id]; if(!e) return null; const x={...e,id}; x._s=evStart(x); x._e=evEnd(x); return x; }

function hotelsList(){ return Object.entries((S&&S.hotels)||{}).map(([id,h])=>({...h,id})).sort((a,b)=>(a.checkIn||"").localeCompare(b.checkIn||"")); }
function hotelOn(date){ return hotelsList().find(h=>date>=h.checkIn && date<h.checkOut)||null; }

function overnightFlight(date){ return evList().find(e=>e.kind==="flight"&&e.date===date&&e.endDate&&e.endDate>date)||null; }

/* 当前所在时区:最近一个已开始事件的(到达)时区;行程开始前用家的时区 */
function curTz(){
  if(!S) return TZ; const now=NOW(); let tz=(S.trip&&S.trip.homeTz)||TZ;
  for(const e of evList()){ if(e._s>now) break; tz = e._e<=now ? (e.endTz||e.tz||TZ) : (e.tz||TZ); }
  if(S.trip&&S.trip.end&&zParts(now,tz).date>S.trip.end){ const last=evList().slice(-1)[0]; if(last&&last._e<=now) tz=last.endTz||last.tz||tz; }
  return tz;
}
function today(){ return zParts(NOW(),curTz()).date; }
function inTrip(d){ return S&&S.trip&&d>=S.trip.start&&d<=S.trip.end; }
function inBiz(d){ const T=S&&S.trip; if(!T||!T.bizEnd) return true; return d>=(T.bizStart||T.start)&&d<=T.bizEnd; }
function defaultType(date){ return inBiz(date)?"business":"personal"; }

function cityOf(e,which){ if(which==="from") return e.fromCity||e.city; if(which==="to") return e.toCity||e.city; return e.city; }
function dayCities(d){
  const out=[]; const add=c=>{ if(c&&out[out.length-1]!==c) out.push(c); };
  const last=hotelOn(addDays(d,-1)); const arr=arrivalsOn(d)[0];
  if(arr) add(cityOf(arr,"to")); else if(last) add(last.city); else if(d===S.trip.start) add(S.trip.home);
  evOn(d).forEach(e=>{ if(e.kind==="flight"||e.kind==="train"){ add(cityOf(e,"from")); add(cityOf(e,"to")); } else if(e.kind!=="transit") add(e.city); });
  const h=hotelOn(d); if(h) add(h.city); else if(d===S.trip.end&&S.trip.home) add(S.trip.home);
  return out;
}
function dayChips(d){
  const T=S.trip, chips=[];
  if(d===T.start) chips.push(["出发日","blue"]);
  else if(d===T.end) chips.push(["回程日","blue"]);
  else { const a=hotelOn(addDays(d,-1)), b=hotelOn(d); if(a&&b&&a.id!==b.id) chips.push(["移动日","amber"]); }
  if(T.bizEnd&&inTrip(d)) chips.push(inBiz(d)?["出差期","green"]:["私人","persim"]);
  return chips;
}
function hotelNightLabel(h,d){ const n=daysBetween(h.checkIn,h.checkOut), i=daysBetween(h.checkIn,d)+1; return n>1?`第 ${i}/${n} 晚`:"1 晚"; }

function defaultCur(){ const h=S&&hotelOn(today()); if(h&&h.currency) return h.currency; return (S&&S.trip&&S.trip.defaultCurrency)||"JPY"; }
function defaultLang(){ const h=S&&hotelOn(today()); if(h&&h.lang) return h.lang; return (S&&S.trip&&S.trip.langs&&S.trip.langs[0])||"ja"; }
function langOf(o){ return (o&&o.lang)||defaultLang(); }

function mapApp(){ return localStorage.getItem("jt_mapapp")||"google"; }
function placeQ(o){ if(!o) return ""; if(typeof o==="string") return o; return [o.nameLocal||o.name||o.title, o.localAddress].filter(Boolean).join(" "); }
function navUrl(o, app){

  if(app==="naver") return `https://map.naver.com/p/search/${encodeURIComponent(o.localAddress||placeQ(o))}`;
  return `https://www.google.com/maps/search/?api=1&query=${qs}`;
}
function dirUrl(from,to,mode,app){
  app=app||mapApp(); const f=encodeURIComponent(from&&typeof from==="object"&&from.localAddress?from.localAddress:placeQ(from)), t=encodeURIComponent(to&&typeof to==="object"&&to.localAddress?to.localAddress:placeQ(to));
  const gm=(MODE[mode]||MODE.taxi)[2];
  if(app==="apple") return `https://maps.apple.com/?${from?`saddr=${f}&`:""}daddr=${t}&dirflg=${gm==="transit"?"r":gm==="walking"?"w":"d"}`;
  return `https://www.google.com/maps/dir/?api=1${from?`&origin=${f}`:""}&destination=${t}&travelmode=${gm}`;

function openUrl(u){ window.open(u,"_blank"); }
function telHref(phone,lang){
  if(!phone) return ""; let p=phone.replace(/[^\d+]/g,"");
  if(p[0]!=="+"){ const cc=(LANGS[lang]&&LANGS[lang].cc)||"81"; p="+"+cc+p.replace(/^0/,""); }

}
function callPhone(phone,lang){ if(!phone){ toast("没有电话号码"); return; } location.href=telHref(phone,lang); }
/* 每个事件“去哪里”:航班/列车 → 出发地;其他 → 自身 */
function destOf(e){
  if(!e) return null;
  if(e.kind==="flight"||e.kind==="train") return { name:e.fromPlace||e.from, localAddress:e.fromAddress||e.fromPlace||"", lang:e.lang };
  if(e.kind==="hotel"&&e.hotelId){ const h=(S.hotels||{})[e.hotelId]; if(h) return {...h, title:h.name}; }
  if(e.kind==="transit"){ const n=nextImportantAfter(e); return n?destOf(n):null; }
  return e.localAddress||e.lat||e.mapUrl ? e : null;
}
function nextImportantAfter(e){ const L=evList(); const i=L.findIndex(x=>x.id===e.id); for(let j=i+1;j<L.length;j++){ if(isImportant(L[j])) return L[j]; } return null; }
function prevOf(e){ const L=evList(); const i=L.findIndex(x=>x.id===e.id); return i>0?L[i-1]:null; }
function nextOf(e){ const L=evList(); const i=L.findIndex(x=>x.id===e.id); return i>=0&&i<L.length-1?L[i+1]:null; }

/* ================= 换乘余量检查 =================
   打车/步行:出发时间 + 最长车程 + 等车 5 分钟;接驳车:准点发车 + 车程;航班落地:国际 +60 / 国内 +20 分钟
   需要提前:国际航班 120 · 国内航班 60 · 列车 10(列车换列车 8)· 接驳车 5 · 订位餐厅/工作 10              */
let _bufCache=null;
function bufferOf(b){
  if(!_bufCache){ _bufCache={}; evList().forEach(x=>{ const r=calcBuffer(x); if(r) _bufCache[x.id]=r; }); }
  return _bufCache[b.id]||null;
}
function calcBuffer(b){
  if(!isImportant(b)&&b.kind!=="train") return null;
  const a=prevOf(b); if(!a) return null;
  let ready;
  if(a.kind==="transit") ready = a._s + ((+a.durMax||+a.durMin||0) + (a.fixed?0:(a.wait!=null?+a.wait:5)))*60000;
  else if(a.kind==="flight") ready = a._e + (a.intl?60:20)*60000;
  else if(a.kind==="train") ready = a._e;
  else return null;
  if(b._s-ready > 6*3600000) return null;
  let lead=0;
  if(b.kind==="flight") lead=b.intl?120:60;
  else if(b.kind==="train") lead=a.kind==="train"?8:10;
  else if(b.kind==="transit"&&b.fixed) lead=5;
  else if(b.kind==="food"&&b.status==="booked") lead=10;
  else if(b.kind==="work") lead=10;
  const slack=Math.round((b._s-ready)/60000-lead);
  const critical=["flight","train","food","work"].includes(b.kind)||(b.kind==="transit"&&b.fixed);
  const status= slack<0?"bad" : (critical&&slack<10)?"warn":"ok";
  let suggest=null;
  if(a.kind==="transit"&&!a.fixed&&status!=="ok"){ const dep=a._s-(10-slack)*60000; const p=zParts(dep,a.tz||TZ); const [hh,mm]=p.time.split(":").map(Number); const m5=Math.floor(mm/5)*5; suggest=`${String(hh).padStart(2,"0")}:${String(m5).padStart(2,"0")}`; }
  const gap=a.kind==="train"&&b.kind==="train" ? Math.round((b._s-a._e)/60000) : null;
  const why = b.kind==="flight"?(b.intl?"国际线建议起飞前 2 小时到":"国内线建议提前 1 小时到")
            : b.kind==="train"?(a.kind==="train"?"同站换乘至少留 8 分钟":"进站、找站台至少留 10 分钟")
            : b.kind==="transit"?"接驳车准点发车,不等人"
            : b.kind==="food"?"打车要等车、可能堵车、还要找入口":"留出找路时间";
  return { a, b, slack, status, suggest, lead, gap, why };
}
function bufHTML(r){
  if(!r) return "";
  const cls=r.status==="bad"?"bad":r.status==="warn"?"warn":"ok";
  let t;
  if(r.gap!=null) t=`换乘 ${r.gap} 分钟${r.status==="ok"?"":r.status==="warn"?" · 偏紧":" · 来不及"}`;
  else if(r.status==="ok") t=`余量 ${r.slack} 分钟`;
  else if(r.status==="warn") t=`余量只有 ${r.slack} 分钟 · ${r.why}${r.suggest?` · 建议 ${r.suggest} 出发`:""}`;
  else t=`赶不上:差 ${-r.slack} 分钟 · ${r.why}${r.suggest?` · 建议 ${r.suggest} 出发`:""}`;
  const fix=r.suggest?` <button class="mini" style="margin:4px 0 0 0;" onclick="applySuggest('${r.a.id}','${r.suggest}')">改成 ${r.suggest} 出发</button>`:"";
  return `<div class="buf"><span class="${cls}">${ic(r.status==="ok"?"check":"alert")} ${esc(t)}</span>${fix}</div>`;
}

/* ================= 清单(手动待办 + 由“待订”事件自动生成的预订任务) ================= */
function bookTasks(){
  const groups={}; const out=[];
  evList().filter(e=>e.status==="todo").forEach(e=>{
    const g=e.bookGroup||("ev:"+e.id); (groups[g]=groups[g]||[]).push(e);
  });
  for(const g in groups){
    const list=groups[g]; const gname=(S.trip.bookGroups||{})[g];
    const due=list.map(e=>e.bookBy).filter(Boolean).sort()[0]||addDays(list[0].date,-3);
    out.push({ id:"bg:"+g, virtual:true, group:g, events:list, due, prio:"high",
      text: gname ? `${gname} · ${list.length} 段` : `预订:${list[0].title}`,
      note: list.map(e=>`${dstr(e.date)} ${e.time} ${e.title}`).join(" / ") });
  }
  return out;
}
function tasksAll(){
  const m=Object.entries((S&&S.tasks)||{}).map(([id,t])=>({...t,id}));
  return m.concat(bookTasks());
}
function phaseOf(t){
  if(t.phase) return t.phase; const T=S.trip;
  if(!t.due) return today()<T.start?"pre":"trip";
  if(t.due<T.start) return "pre"; if(t.due>T.end) return "post"; return "trip";
}
const PHASE={ pre:"出发前", trip:"旅行途中", post:"回程后" };
const PRIO={ high:0, mid:1, low:2 };
function dueChip(d){ if(!d) return ""; const t=today(); const n=daysBetween(t,d);
  const cls=n<0?"over":n===0?"today":""; const lb=n<0?`已过 ${-n} 天`:n===0?"今天":n===1?"明天":`${dstr(d)} 前`;
  return `<span class="due ${cls}">${lb}</span>`; }
function sortTasks(a,b){ return (a.due||"9999").localeCompare(b.due||"9999") || (PRIO[a.prio||"mid"]-PRIO[b.prio||"mid"]) || ((a.ts||0)-(b.ts||0)); }

/* ================= 花费模型 =================
   预估金额 = 收据金额 × 汇率;实际支付 = 信用卡上真实扣款(含手续费);公司报销 = 按规则确认后由公司承担的部分 */
const CATS_EXP=["餐饮","咖啡甜品","交通","住宿","器具设备","原料食材","伴手礼","购物","门票娱乐","其他"];
const CAT_ICO={餐饮:"🍽",咖啡甜品:"☕",交通:"🚄",住宿:"🏨",器具设备:"🔧",原料食材:"🧈",伴手礼:"🎁",购物:"🛍",门票娱乐:"🎫",其他:"📎",未分类:"❔"};
function catOf(e){ return e.category||"未分类"; }
function catLabel(c){ return (CAT_ICO[c]||"·")+" "+c; }
function fmtLocal(n,cur){ cur=cur||defaultCur(); const c=CURRENCIES[cur]||{symbol:cur+" ",locale:"en-US",dec:2}; const d=c.dec||0;
  return c.symbol+(+n||0).toLocaleString(c.locale,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function c$(n){ return "C$"+(+n||0).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function isExact(e){ return +e.paidCAD>0 || (e.currency||defaultCur())==="CAD"; }
function needsPaid(e){ return e.pay==="card" && !isExact(e); }
function estCAD(e){ const cur=e.currency||defaultCur(); return cur==="CAD"?(+e.amountLocal||0):(+e.amountLocal||0)*(e.rate||rate(cur)); }
function cadOf(e){ return +e.paidCAD>0 ? +e.paidCAD : estCAD(e); }
function cadTxt(e){ return (isExact(e)?"":"≈")+c$(cadOf(e)); }
function companyCAD(e){ if(e.type==="business") return cadOf(e); if(e.type==="mixed") return Math.min(+e.bizCAD||0, cadOf(e)); return 0; }
function personalCAD(e){ return cadOf(e)-companyCAD(e); }
function isCo(e){ return e.type==="business"||e.type==="mixed"; }
function basisOf(e){ return +e.paidCAD>0?"卡上实付":(e.currency==="CAD"?"加币原价":(e.pay==="card"?"汇率估算(待对账)":"汇率估算")); }
/* 出差期外但有依据:关联了公司行程,或是公司住宿的退房日账单 */
function bizJustified(e){
  if(inBiz(e.date)) return true;
  const ev0=e.eventId&&S.events&&S.events[e.eventId]; if(ev0&&ev0.biz==="business") return true;
  if(e.category==="住宿"){ const h=hotelsList().find(h=>h.checkOut===e.date&&h.biz==="business"); if(h) return true; }
  return false;
}
function issuesOf(e){
  const out=[];
  if(needsPaid(e)) out.push({k:"paid",t:"待对账",c:"w"});
  if(isCo(e)&&!e.receipt&&!e.noReceipt) out.push({k:"receipt",t:"缺票据",c:"r"});
  if(isCo(e)&&/餐饮|咖啡/.test(e.category||"")&&(!e.purpose||!e.attendees)) out.push({k:"purpose",t:"缺用途/同席",c:"w"});
  if(e.type==="mixed"&&!(+e.bizCAD>0)) out.push({k:"bizcad",t:"缺公司金额",c:"w"});
  if(isCo(e)&&!bizJustified(e)&&!e.confirmed) out.push({k:"period",t:"出差期外",c:"w"});
  return out;
}
function expList(){ return Object.entries((S&&S.expenses)||{}).map(([id,e])=>({...e,id})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0)); }
function catGroups(list,val){ val=val||cadOf; const m={}; list.forEach(e=>{ const c=catOf(e); (m[c]=m[c]||[]).push(e); });
  return Object.entries(m).map(([cat,l])=>({cat,list:l,cad:l.reduce((s,e)=>s+val(e),0),exact:l.every(isExact)})).sort((a,b)=>b.cad-a.cad); }
/* 记账归属建议:关联了行程 → 跟行程;住宿 → 跟那段住宿(退房日的账单算前一晚);否则按出差期 */
function suggestType(date,category,eventId){
  if(eventId&&S.events&&S.events[eventId]&&S.events[eventId].biz) return S.events[eventId].biz;
  if(category==="住宿"){ const h=hotelsList().find(h=>h.checkOut===date)||hotelOn(date); if(h&&h.biz) return h.biz; }
  return defaultType(date);
}
function expensesOfEvent(id){ return expList().filter(x=>x.eventId===id); }
function applySuggest(id,time){ const e=S.events[id]; if(!e) return; const old=e.time; patch("events/"+id,{time,edited:Date.now()}); logChange(e.date,`${e.title}:${old} → ${time}(按余量建议)`); toast(`已改成 ${time} 出发 ✓`); }
function logChange(date,text){ if(!S||LOCAL) return; const id=uid(); write("log/"+id,{date:date||today(),text,ts:Date.now()}); }

/* ================= 外壳 ================= */
const TABS=[["today","今日","today"],["plan","行程","plan"],["map","地图","map"],["money","花费","money"],["tools","工具","tools"]];
function tabBadges(){
  if(!S) return {};

  const d=today(); const tools=tasksAll().filter(t=>!t.done&&t.due&&t.due<=d).length + evList().filter(e=>{ const b=bufferOf(e); return b&&b.status==="bad"&&e._s>NOW(); }).length;
  return { money, tools };

function renderTabs(){
  const bd=tabBadges();

function goTab(t,keepTool){ tab=t; if(!keepTool) toolView=null; localStorage.setItem("jt_tab",t); render(); window.scrollTo(0,0); }
function render(){

function panelNext(e){

  const sub=[e.carrier, e.conf?("订单 "+e.conf):"", dual?e.sub:""].filter(Boolean).join(" · ");

      <div><div class="cl">${cross?tzName(tz1)+"当地时间":"出发"}</div><div class="cv">${dstr(e.date)} ${esc(e.time)}</div><div class="cp">${esc(e.from||"")} 出发</div></div>

  }else{
    const where=e.kind==="hotel"&&e.hotelId&&S.hotels[e.hotelId]?S.hotels[e.hotelId]:e;
    h+=`<div class="p-meta">${ic("clock")} ${dstr(e.date)} ${esc(e.time)}${e.endTime?"–"+esc(e.endTime):""}${e.party?" · "+esc(e.party):""}${e.kind!=="hotel"&&e.sub?" · "+esc(e.sub):""}</div>

  }
  // 倒计时 + 什么时候出发
  if(e._s>now) h+=`<div class="countdown ${e._s-now<3*3600000?"soon":""}">${ic("clock")} 还有 ${fmtDur((e._s-now)/60000)}</div>`;

  const pl=prevOf(e);

    const md=(MODE[pl.mode]||MODE.taxi)[0]; const dur=pl.durMax?`${pl.durMin||pl.durMax}–${pl.durMax} 分钟`:"";
    h+=`<div class="pre-leg">${ic((MODE[pl.mode]||MODE.taxi)[1])} 建议 <b>${esc(pl.time)}</b> 出发${pl.toLabel?"去"+esc(pl.toLabel):""} · ${md} ${dur}${pl._s>now?` · 还有 ${fmtDur((pl._s-now)/60000)}`:" · <b>该出发了</b>"}</div>`;
  }
  const bf=bufferOf(e); if(bf&&bf.status!=="ok") h+=`<div style="margin-top:8px;">${bufHTML(bf).replace('class="buf"','class="buf" style="margin:0"')}</div>`;
  // 今晚住哪

    const ht=hotelOn(d); let night="";
    if(ht) night=`<div class="night" onclick="openHotel('${ht.id}')">${ic("bed")}<div style="flex:1">今晚住宿:${esc(ht.name)}<small>${hotelNightLabel(ht,d)}${ht.conf?" · 预约号 "+esc(ht.conf):""}</small></div>${ic("chevR")}</div>`;
    else if(overnightFlight(d)){ const nh=nextHotelAfter(d); night=`<div class="night">${ic("plane")}<div style="flex:1">今晚住宿:飞机上${nh?`<small>${dstr(nh.checkIn)} 入住 ${esc(nh.name)}</small>`:""}</div></div>`; }
    else if(d===S.trip.end) night=`<div class="night">${ic("today")}<div style="flex:1">今晚:回到${esc(S.trip.home||"家")}</div></div>`;
    if(night) h+=`<div class="hr"></div>`+night;
  }
  h+=`<div class="qa">${qaFor(e).join("")}</div></div>`;
  return h;
}
function todoTitle(d){ const T=S.trip; if(d<=T.start) return "出发前需要完成"; if(d>T.end) return "回程后需要完成"; return "今天需要完成"; }
function todayTasks(d){
  const T=S.trip; const lim=addDays(d,2), lim2=addDays(d,5);

function taskRow(t){

    h+=`<div class="rowlist">${evs.length?evs.map(e=>`<div class="row" onclick="selDay='${e.date}';openCard['${e.id}']=true;goTab('plan')">

function moreLabel(e){ if(e.moreLabel) return e.moreLabel; return {food:"详细地址、入店说明与更多",hotel:"地址、入住说明与更多",flight:"航站楼、行李与更多",train:"站台、换乘与更多",transit:"上车点与更多"}[e.kind]||"详情与更多"; }
function evActs(e){
  const id=e.id, B=(icon,label,fn,cls)=>`<button class="${cls||""}" onclick="event.stopPropagation();${fn}">${ic(icon)}<span>${label}</span></button>`;
  const a=[];

  if(e.kind==="flight"||e.kind==="train"){ a.push(B("ticket",e.kind==="flight"?"机票凭证":"车票凭证",`openDocs('${id}')`)); a.push(B("nav",e.kind==="flight"?"机场导航":"车站导航",`goNav('${id}')`)); }
  else if(e.kind==="food"){ a.push(B("nav","导航",`goNav('${id}')`)); if(e.phone) a.push(B("phone","电话",`callEv('${id}')`)); a.push(B("doc","预约信息",`openBooking('${id}')`)); }
  else if(e.kind==="hotel"){ a.push(B("nav","导航",`goNav('${id}')`)); a.push(B("phone","电话",`callEv('${id}')`)); a.push(B("doc","预约信息",`openHotel('${e.hotelId}')`)); }
  else if(e.kind==="transit"){ a.push(B("nav","上车点",`goNav('${id}')`)); if(e.phone||hotelPhoneFor(e)) a.push(B("phone","电话",`callEv('${id}')`)); a.push(B("doc","预约信息",`openBooking('${id}')`)); }

/* ---- 地点搜索(OpenStreetMap,免费无 key)---- */
function geoRowHTML(prefix){
  return `<div class="f"><label>搜索地点(自动填地址和坐标)</label>
    <div class="geo-row"><input id="${prefix}_geoq" placeholder="店名/地名 + 城市" onkeydown="if(event.key==='Enter'){event.preventDefault();geoSearch('${prefix}')}"><button type="button" class="btn indigo" onclick="geoSearch('${prefix}')">搜索</button></div>
    <div class="geo-row"><input id="${prefix}_gm" placeholder="或粘贴 Google Maps 分享链接"><button type="button" class="btn ghost" onclick="parseGmaps('${prefix}')">解析</button></div>
    <div id="${prefix}_geores" class="geo-res"></div><div id="${prefix}_geook"></div></div>`;
}
function parseGmaps(prefix){
  const raw=$("#"+prefix+"_gm").value.trim(); const um=raw.match(/https?:\/\/\S+/); if(!um){ toast("没有检测到链接"); return; }
  const url=um[0]; let lat=null,lng=null; const cm=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)||url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(cm){ lat=parseFloat(cm[1]); lng=parseFloat(cm[2]); }
  const m=$("#"+prefix+"_map"); if(m) m.value=url;
  if(lat!=null){ const a=$("#"+prefix+"_lat"),b=$("#"+prefix+"_lng"); if(a) a.value=lat.toFixed(6); if(b) b.value=lng.toFixed(6); }
  $("#"+prefix+"_geook").innerHTML=`<div class="geo-ok">✓ 链接已保存,Google 导航将直达该图钉</div>`;
}
const COUNTRY_NAMES=["日本","대한민국","한국","中国"];
function cleanLocalAddr(it){ return it.display_name.split(",").map(s=>s.trim()).filter(s=>s&&!COUNTRY_NAMES.includes(s)&&!/^\d{3}-?\d{4}$/.test(s)&&!/^\d{5}$/.test(s)).reverse().join(""); }
async function geoSearch(prefix){
  const qv=$("#"+prefix+"_geoq").value.trim(); if(!qv) return; const box=$("#"+prefix+"_geores"); box.innerHTML=`<div class="muted">搜索中…</div>`;
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=${defaultLang()}&q=${encodeURIComponent(qv)}`); const list=await r.json();
    if(!list.length){ box.innerHTML=`<div class="muted">没有找到,试试加上城市名</div>`; return; } window._geoList=list;
    box.innerHTML=list.map((it,i)=>`<div class="geo-item" onclick="geoPick('${prefix}',${i})"><b>${esc((it.name||it.display_name.split(",")[0]).trim())}</b><span>${esc(cleanLocalAddr(it))}</span></div>`).join("");
  }catch(e){ box.innerHTML=`<div class="muted">搜索失败,请检查网络</div>`; }
}
function geoPick(prefix,i){
  const it=window._geoList[i]; const a=$("#"+prefix+"_addr"); if(a) a.value=cleanLocalAddr(it);
  const la=$("#"+prefix+"_lat"),ln=$("#"+prefix+"_lng"); if(la) la.value=(+it.lat).toFixed(6); if(ln) ln.value=(+it.lon).toFixed(6);
  const nl=$("#"+prefix+"_nameLocal"); if(nl&&!nl.value.trim()) nl.value=(it.name||"").trim();
  $("#"+prefix+"_geores").innerHTML=""; $("#"+prefix+"_geook").innerHTML=`<div class="geo-ok">✓ 已定位:${esc((it.name||"").slice(0,30))}</div>`;
}

/* ================= 花费 ================= */
function sumBy(list,f){ return list.reduce((s,e)=>s+f(e),0); }
function settleState(){
  const ex=expList(), co=ex.filter(isCo);
  return [
    { t:"核对信用卡", ok: !ex.some(needsPaid), n: ex.filter(needsPaid).length },
    { t:"补齐票据", ok: !co.some(e=>issuesOf(e).some(i=>["receipt","purpose","bizcad"].includes(i.k))), n: co.filter(e=>issuesOf(e).some(i=>["receipt","purpose","bizcad"].includes(i.k))).length },
    { t:"确认公司归属", ok: co.length>0 && co.every(e=>e.confirmed), n: co.filter(e=>!e.confirmed).length },
    { t:"导出报销包", ok: !!(S.trip&&S.trip.exportedAt), n: 0 }
  ];
}
function renderMoney(){
  if(expView==="settle"){ renderSettle(); return; }
  const ex=expList(), co=ex.filter(isCo);
  const coTot=sumBy(co,companyCAD), coConf=sumBy(co.filter(e=>e.confirmed),companyCAD), per=sumBy(ex,personalCAD);
  const exact=ex.filter(e=>+e.paidCAD>0), fee=sumBy(exact,e=>e.paidCAD-estCAD(e)), pend=ex.filter(needsPaid);
  const issues=ex.filter(e=>issuesOf(e).some(i=>i.k!=="paid"));
  const st=settleState();
  let h=`<div class="stat-grid">
    <div class="stat"><div class="lb"><span class="dot b"></span>公司报销</div><div class="big">${c$(coTot)}</div><div class="sm">${co.length} 笔 · 已确认 ${c$(coConf)}</div></div>
    <div class="stat"><div class="lb"><span class="dot p"></span>私人</div><div class="big">${c$(per)}</div><div class="sm">${ex.filter(e=>personalCAD(e)>0).length} 笔</div></div>
    <div class="stat wide"><div class="lb"><span class="dot a"></span>预估 vs 实际支付</div>
      <div class="sm" style="font-size:13px;color:var(--ink);margin-top:4px;">预估合计 <b>${c$(sumBy(ex,estCAD))}</b> · 入账合计 <b>${c$(sumBy(ex,cadOf))}</b></div>
      <div class="sm">${exact.length} 笔按卡上实付入账${exact.length?`(比汇率估算${fee>=0?"多":"少"} ${c$(Math.abs(fee))},含银行手续费)`:""}${pend.length?` · <b style="color:var(--amber-dk)">${pend.length} 笔待对账</b>`:""}</div></div>
  </div>
  <div class="flow" onclick="goSettle()"><div style="flex:1"><b style="font-size:14px;">旅行结束结算</b><div class="muted">${st.map(s=>s.t).join(" → ")}</div><div class="fs">${st.map(s=>`<span class="${s.ok?"ok":s.n?"todo":""}"></span>`).join("")}</div></div>${ic("chevR")}</div>
  <div class="quick" style="margin-top:14px;">
    <button class="btn dark" style="flex:1.3" onclick="$('#receiptInput').click()">${ic("cam")} 拍收据</button>
    <button class="btn ghost" style="flex:1" onclick="newExpense({})">${ic("plus")} 手动记一笔</button>
  </div>
  <div class="quick">
    <input id="qAmt" type="number" inputmode="decimal" placeholder="金额">
    <select id="qCur" style="flex:0 0 86px;">${curList().map(c=>`<option ${c===defaultCur()?"selected":""}>${c}</option>`).join("")}</select>
    <input id="qMemo" placeholder="备注,如 便利店" style="flex:1.4">
  </div>
  <div class="quick" style="margin-top:0">
    <select id="qPay" style="flex:0 0 108px;"><option value="card">刷卡</option><option value="cash">现金/IC</option></select>
    <button class="btn b" style="flex:1" onclick="quickAdd('business')">存为公司${defaultType(today())==="business"?" ✓":""}</button>
    <button class="btn p" style="flex:1" onclick="quickAdd('personal')">存为私人${defaultType(today())==="personal"?" ✓":""}</button>
  </div>
  <div class="chips" style="margin-top:8px;">
    ${[["all","全部"],["co","公司"],["pers","私人"],["paid",`待对账 ${pend.length}`],["issue",`待补资料 ${issues.length}`]].map(([k,l])=>`<button class="fchip ${expFilter===k?"on":""}" onclick="expFilter='${k}';render()">${l}</button>`).join("")}
    <button class="fchip ${expView==="cat"?"on":""}" onclick="expView=expView==='cat'?'date':'cat';expCat='';render()">${expView==="cat"?"按分类 ✓":"按分类"}</button>
  </div>`;
  let list=ex;
  if(expFilter==="co") list=ex.filter(isCo); else if(expFilter==="pers") list=ex.filter(e=>e.type==="personal"||e.type==="mixed");
  else if(expFilter==="paid") list=pend; else if(expFilter==="issue") list=issues;
  if(expFilter==="paid"&&pend.length) h+=`<div class="hint">打开银行 App,按每笔的日期和金额找到加币扣款,填进去就行。</div>`;
  if(expView==="cat"){
    const groups=catGroups(list); const max=Math.max(...groups.map(g=>g.cad),1);
    h+=`<div class="cat-card"><div class="hd"><span>分类汇总 · ${list.length} 笔</span><span>CAD</span></div>${groups.map(g=>`<div class="cat-row ${expCat===g.cat?"on":expCat?"dim":""}" onclick="expCat=expCat==='${q(g.cat)}'?'':'${q(g.cat)}';render()"><span class="cn">${esc(catLabel(g.cat))}</span><span class="bar"><i style="width:${(g.cad/max*100).toFixed(1)}%;background:var(--indigo)"></i></span><span class="ca">${g.exact?"":"≈"}${c$(g.cad)}<small>${g.list.length} 笔</small></span></div>`).join("")}</div>`;
    groups.filter(g=>!expCat||g.cat===expCat).forEach(g=>{ h+=`<div class="grp-hd"><span class="gt">${esc(catLabel(g.cat))}</span><span class="muted">${c$(g.cad)}</span></div>`+g.list.map(e=>expRow(e,true)).join(""); });
  }else{
    const byDay={}; list.forEach(e=>{ (byDay[e.date||""]=byDay[e.date||""]||[]).push(e); });
    Object.keys(byDay).sort().reverse().forEach(d=>{ h+=`<div class="grp-hd"><span class="gt">${d?dstr(d)+" 周"+weekday(d):"无日期"}</span><span class="muted">${c$(sumBy(byDay[d],cadOf))}</span></div>`+byDay[d].map(e=>expRow(e)).join(""); });
  }
  if(!list.length) h+=`<div class="empty">${expFilter==="paid"?"没有待对账的刷卡记录 ✓":expFilter==="issue"?"资料都齐了 ✓":"还没有记录"}</div>`;
  $("#view").innerHTML=h;
}
function typeTag(e){ return e.type==="business"?'<span class="tag b">公司</span>':e.type==="mixed"?`<span class="tag b">公司 ${c$(companyCAD(e))}</span>`:'<span class="tag p">私人</span>'; }
function expRow(e,showDate,withPaid){
  const iss=issuesOf(e);
  return `<div class="exp-item">
    ${e.receipt?`<img class="thumb" src="${e.receipt}" onclick="viewPhoto(this.src)">`:`<div class="thumb-ph" onclick="attachReceipt('${e.id}')">${ic("cam")}</div>`}
    <div class="mid" onclick="openExpenseForm('${e.id}')"><div class="m1">${esc(e.merchant||"(无备注)")}</div>
      <div class="m2">${showDate?dstr(e.date)+" · ":""}${esc(e.category||"未分类")} ${typeTag(e)} ${iss.map(i=>`<span class="tag ${i.c}">${i.t}</span>`).join(" ")}${e.confirmed&&isCo(e)?'<span class="tag g">已确认</span>':""}</div>
      ${e.detail?`<div class="m2" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;">${esc(e.detail)}</div>`:""}</div>
    <div class="amt" onclick="openExpenseForm('${e.id}')"><div class="y">${fmtLocal(e.amountLocal,e.currency)}</div><div class="c">${cadTxt(e)}</div></div>
  </div>${needsPaid(e)&&(withPaid||(expFilter==="paid"&&expView!=="settle"))?`<div class="rec-row"><input id="pd_${e.id}" type="number" inputmode="decimal" step="0.01" placeholder="卡上实付 C$(估 ${estCAD(e).toFixed(2)})"><button class="btn indigo" onclick="savePaidInline('${e.id}')">保存</button></div>`:""}`;
}
function savePaidInline(id){ const v=parseFloat($("#pd_"+id).value); if(!(v>0)){ toast("填卡上扣的加币金额"); return; } save("expenses/"+id+"/paidCAD",Math.round(v*100)/100); toast("已按实付入账 ✓"); }
function quickAdd(type){
  const a=parseFloat($("#qAmt").value); if(!a){ toast("请填写金额"); return; }
  const cur=$("#qCur").value, d=today();
  push("expenses",{ amountLocal:a, currency:cur, type, pay:$("#qPay").value, merchant:$("#qMemo").value.trim(), date:d, rate:rate(cur), ts:Date.now() });
  toast(type==="business"?"已存入公司 · 记得补拍收据":"已存入私人");
}
function attachReceipt(id){ window._attachExp=id; $("#receiptAttach").click(); }
$("#receiptAttach").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const b64=await compressImage(f,1400,0.6);
  if(window._attachExp==="__form"){ window._ex.receipt=b64; window._ex.rhash=strHash(b64); const p=$("#ex_rcbox"); if(p) p.innerHTML=rcBox(); ocrInto(b64); return; }
  const id=window._attachExp; if(!id) return; patch("expenses/"+id,{receipt:b64,rhash:strHash(b64)}); toast("票据已补上 ✓");
});

/* ---- 记账表单(新增 / 编辑共用) ---- */
function curList(){ return (S&&S.trip&&S.trip.currencies&&S.trip.currencies.length)?S.trip.currencies:Object.keys(CURRENCIES); }
function catOptions(sel){ const base=CATS_EXP.includes(sel)?CATS_EXP:(sel?[sel,...CATS_EXP]:["",...CATS_EXP]); return base.map(c=>`<option value="${esc(c)}" ${c===sel?"selected":""}>${c||"—"}</option>`).join(""); }
function curOf(date){ const h=hotelOn(date); return (h&&h.currency)||defaultCur(); }
function newExpense(preset){ openExpenseForm(null,preset||{}); }
function newExpenseFromEvent(id){
  const e=ev(id); if(!e) return;
  const cat={food:"餐饮",hotel:"住宿",flight:"交通",train:"交通",transit:"交通"}[e.kind]||"";
  const h=e.hotelId&&S.hotels[e.hotelId];
  openExpenseForm(null,{ merchant:h?h.name:(e.nameLocal&&e.kind==="food"?e.title:e.title), date:e.date, category:cat, eventId:id, type:e.expType||e.biz||defaultType(e.date),
    attendees:e.party||"", purpose:e.purpose||"", currency:curOf(e.date), detail:e.kind==="train"||e.kind==="flight"?`${e.from||""} → ${e.to||""}`:"" });
}
function rcBox(){ const x=window._ex; return x.receipt?`<img class="receipt-preview" src="${x.receipt}" onclick="viewPhoto(this.src)"><div class="dbtns" style="margin-top:6px;"><button class="pbtn" onclick="window._attachExp='__form';$('#receiptAttach').click()">${ic("cam")} 换一张</button></div>`
  : `<button class="btn ghost full" onclick="window._attachExp='__form';$('#receiptAttach').click()">${ic("cam")} 拍收据 / 选照片${localStorage.getItem("jt_apikey")?"(自动识别金额)":""}</button>`; }
function evOptions(date,sel){
  const L=evList().filter(e=>isImportant(e)&&Math.abs(daysBetween(e.date,date||e.date))<=1);
  return `<option value="">— 不关联</option>`+L.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${dstr(e.date)} ${esc(e.time)} ${esc(e.title)}</option>`).join("");
}
function openExpenseForm(id,preset){
  const e=id?{...S.expenses[id]}:{ date:today(), currency:defaultCur(), pay:"card", ...preset };
  if(!id&&!e.type) e.type=suggestType(e.date,e.category,e.eventId);
  window._ex={ id, receipt:e.receipt||null, rhash:e.rhash||null, type:e.type||"business", pay:e.pay||"card", suggest:e.suggest||null };
  const sug=suggestType(e.date,e.category,e.eventId);
  sheet(`<h3>${id?"编辑记录":"记一笔"}</h3>
    <div id="ex_rcbox" style="margin-bottom:12px;">${rcBox()}</div>
    <div id="ex_ocr"></div>
    <div class="f-row"><div class="f"><label>收据金额</label><div style="display:flex;gap:6px;"><input id="ex_amt" type="number" inputmode="decimal" value="${e.amountLocal||""}" style="flex:1;min-width:0;" oninput="estUpd()">
      <select id="ex_cur" style="width:86px;flex:0 0 auto;padding:10px 6px;" onchange="estUpd()">${curList().map(c=>`<option ${c===e.currency?"selected":""}>${c}</option>`).join("")}</select></div></div>
      <div class="f" style="flex:0 0 140px;"><label>日期</label><input id="ex_date" type="date" value="${esc(e.date||"")}" onchange="estUpd()"></div></div>
    <div class="f"><label>支付方式</label><div class="seg mini"><button type="button" id="ex_pc" onclick="window._ex.pay='card';estUpd()">${ic("card")} 刷卡</button><button type="button" id="ex_pm" onclick="window._ex.pay='cash';estUpd()">现金 / IC 卡</button></div></div>
    <div class="f" id="ex_paidbox"><label>实际支付 · 卡上扣的加币(看银行 App 推送;不知道先空着)</label>
      <input id="ex_paid" type="number" inputmode="decimal" step="0.01" value="${e.paidCAD||""}" placeholder="如 52.37" oninput="estUpd()"><div class="muted" id="ex_est" style="margin-top:4px;"></div></div>
    <div class="f"><label>商家</label><input id="ex_mer" value="${esc(e.merchant||"")}"></div>
    <div class="f-row"><div class="f"><label>分类</label><select id="ex_cat">${catOptions(e.category||"")}</select></div></div>
    <div class="f"><label>明细(交通区间 / 品项等)</label><input id="ex_detail" value="${esc(e.detail||"")}"></div>
    <div class="f"><label>关联行程</label><select id="ex_ev">${evOptions(e.date,e.eventId)}</select></div>
    <div class="f"><label>归属 ${sug?`<span class="muted">· 建议:${sug==="business"?"公司":"私人"}${e.suggest&&e.suggest!==sug?` · Claude 认为:${e.suggest==="business"?"公司":"私人"}`:""}</span>`:""}</label>
      <div class="seg"><button id="sg_business" onclick="typePick('business')">公司</button><button id="sg_personal" onclick="typePick('personal')">私人</button><button id="sg_mixed" onclick="typePick('mixed')">部分公司</button></div></div>
    <div id="ex_cobox">
      <div class="f" id="ex_mixbox"><label>公司承担 C$(如回程机票:只报相当于原定回程的部分)</label><input id="ex_bizcad" type="number" inputmode="decimal" step="0.01" value="${e.bizCAD||""}"></div>
      <div class="f"><label>商务目的</label><input id="ex_purpose" value="${esc(e.purpose||"")}" placeholder="如:与供应商洽谈 2027 年采购"></div>
      <div class="f"><label>同席 / 参与人</label><input id="ex_att" value="${esc(e.attendees||"")}" placeholder="如:2 位 · 本人 + ○○ 社 田中"></div>
      <label style="font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px;"><input type="checkbox" id="ex_norc" ${e.noReceipt?"checked":""}> 没有纸质收据(用确认邮件/账单截图代替)</label>
      <label style="font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px;"><input type="checkbox" id="ex_conf" ${e.confirmed?"checked":""}> 已确认归属公司</label>
    </div>
    <div class="btns">${id?`<button class="btn ghost" style="color:var(--danger)" onclick="if(confirm('删除这笔记录?')){del('expenses/${id}');closeSheet()}">删除</button>`:""}<button class="btn indigo" onclick="saveExpense()">保存</button></div>`);
  typePick(window._ex.type); estUpd();
}
function typePick(t){ window._ex.type=t; ["business","personal","mixed"].forEach(k=>{ const b=$("#sg_"+k); if(b) b.className=k===t?"on "+(k==="business"?"b":k==="personal"?"p":"m"):""; });
  const cb=$("#ex_cobox"); if(cb) cb.classList.toggle("hidden",t==="personal"); const mb=$("#ex_mixbox"); if(mb) mb.classList.toggle("hidden",t!=="mixed"); }
function estUpd(){
  const x=window._ex; if(!x) return; const pay=x.pay;
  const c=$("#ex_pc"),m=$("#ex_pm"); if(c) c.className=pay==="card"?"on":""; if(m) m.className=pay==="cash"?"on":"";
  const cur=$("#ex_cur").value; $("#ex_paidbox").classList.toggle("hidden",pay!=="card"||cur==="CAD");
  const amt=parseFloat($("#ex_amt").value)||0, paid=parseFloat($("#ex_paid").value)||0, est=amt*rate(cur), el=$("#ex_est");
  if(!amt){ el.textContent=""; return; }
  el.textContent = paid ? `预估 C$${est.toFixed(2)} · 实付 C$${paid.toFixed(2)} · 实际汇率 1 ${cur} = C$${(paid/amt).toFixed(cur==="USD"?4:5)} · 差 C$${(paid-est).toFixed(2)}(手续费/汇差)` : `预估约 C$${est.toFixed(2)}(按今日汇率)· 实付待补`;
}
function findDuplicate(rec,selfId){
  return expList().find(o=>o.id!==selfId && ( (rec.rhash&&o.rhash===rec.rhash) || (o.date===rec.date && o.currency===rec.currency && Math.abs((+o.amountLocal||0)-rec.amountLocal)<0.005) ));
}
function saveExpense(){
  const x=window._ex, id=x.id, old=id?S.expenses[id]:{};
  const a=parseFloat($("#ex_amt").value); if(!a){ toast("请填写金额"); return; }
  const cur=$("#ex_cur").value; const paid=parseFloat($("#ex_paid").value);
  const rec={ ...old, amountLocal:a, currency:cur, date:$("#ex_date").value, pay:x.pay, merchant:$("#ex_mer").value.trim(), category:$("#ex_cat").value,
    detail:$("#ex_detail").value.trim(), eventId:$("#ex_ev").value||null, type:x.type, rate:old.rate||rate(cur), ts:old.ts||Date.now(),
    paidCAD:(x.pay==="card"&&cur!=="CAD"&&paid>0)?Math.round(paid*100)/100:null, receipt:x.receipt||null, rhash:x.rhash||null };
  if(x.type!=="personal"){ rec.purpose=$("#ex_purpose").value.trim()||null; rec.attendees=$("#ex_att").value.trim()||null; rec.noReceipt=$("#ex_norc").checked||null; rec.confirmed=$("#ex_conf").checked||null; }
  else { rec.purpose=rec.attendees=rec.noReceipt=rec.confirmed=null; }
  rec.bizCAD = x.type==="mixed" ? (parseFloat($("#ex_bizcad").value)||null) : null;
  const dup=findDuplicate(rec,id);
  if(dup && !confirm(`可能重复:${dstr(dup.date)} ${dup.merchant||""} ${fmtLocal(dup.amountLocal,dup.currency)} 已经记过${dup.rhash&&dup.rhash===rec.rhash?"(同一张收据)":""}。\n仍要保存吗?`)) return;
  Object.keys(rec).forEach(k=>{ if(rec[k]===null||rec[k]==="") delete rec[k]; });
  if(id) save("expenses/"+id,rec); else push("expenses",rec);
  closeSheet(); window._ex=null;
  toast(rec.paidCAD?`已保存 · 按实付 C$${rec.paidCAD.toFixed(2)} 入账`:(x.pay==="card"&&cur!=="CAD"?"已保存 · 实付可稍后补":"已保存"));
}

/* ---- 收据识别 ---- */
$("#receiptInput").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const b64=await compressImage(f,1400,0.6);
  openExpenseForm(null,{ receipt:b64, rhash:strHash(b64) });
  window._ex.receipt=b64; window._ex.rhash=strHash(b64); $("#ex_rcbox").innerHTML=rcBox();
  ocrInto(b64);
});
async function ocrInto(b64){
  if(!localStorage.getItem("jt_apikey")){ $("#ex_ocr").innerHTML=`<div class="muted" style="margin:-4px 0 10px;">在设置里填 Claude API key,拍照后可自动识别金额与商家</div>`; return; }
  if($("#ex_amt").value){ return; }
  $("#ex_ocr").innerHTML=`<div class="hint blue">Claude 正在识别收据…</div>`;
  const d=$("#ex_date").value||today(); const curs=curList();
  const evs=evList().filter(e=>isImportant(e)&&Math.abs(daysBetween(e.date,d))<=1).map(e=>`${e.id}: ${e.date} ${e.time} ${e.title}`).join("\n");
  try{
    const txt=await askClaude([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64.split(",")[1]}},
      {type:"text",text:`这是一张旅行中的收据,货币是 ${curs.join("/")} 之一。今天大约是 ${d}。附近的行程(id: 日期 时间 标题):\n${evs||"无"}\n只返回 JSON:{"amount":数字(含税总额),"currency":"${curs.join("|")}","merchant":"商家名","date":"YYYY-MM-DD","category":"${CATS_EXP.join("|")}","detail":"一句话明细(交通写区间,没有就结合行程推断并标注(推断))","pay":"card|cash(有 クレジット/カード/VISA/신용카드/승인 等选 card;現金/お釣り/현금/交通IC卡 选 cash;看不出选 card)","eventId":"能对上的行程 id,对不上留空","suggest":"business|personal"}`}],500);
    const p=parseJSON(txt);
    const set=(id,v)=>{ const el=$("#"+id); if(el&&v!=null&&v!==""&&!el.value) el.value=v; };
    set("ex_amt",p.amount); if(p.currency&&curs.includes(p.currency)) $("#ex_cur").value=p.currency;
    set("ex_mer",p.merchant); if(p.date) $("#ex_date").value=p.date; if(p.category&&CATS_EXP.includes(p.category)) $("#ex_cat").value=p.category; set("ex_detail",p.detail);
    window._ex.pay=p.pay==="cash"?"cash":"card";
    if(p.eventId&&S.events[p.eventId]){ $("#ex_ev").innerHTML=evOptions(p.date||d,p.eventId); }
    const sug=suggestType(p.date||d,p.category,p.eventId||null); typePick(sug); window._ex.suggest=p.suggest;
    $("#ex_ocr").innerHTML=`<div class="hint blue">已识别 · 请核对金额${p.suggest&&p.suggest!==sug?` · Claude 认为这笔更像${p.suggest==="business"?"公司":"私人"}`:""}</div>`;
    estUpd();
  }catch(e){ $("#ex_ocr").innerHTML=`<div class="hint">识别失败:${esc(e.message)} · 请手动填写</div>`; }
}

function csvCell(t){ return `"${(t==null?"":String(t)).replace(/"/g,'""')}"`; }
function rcName(e,i){ return `receipts/${(e.date||"").replace(/-/g,"")}-${String(i).padStart(2,"0")}-${(e.merchant||"receipt").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,24)}.jpg`; }
function receiptFiles(){ const m={}; let i=0; expList().slice().reverse().forEach(e=>{ if(e.receipt) m[e.id]=rcName(e,++i); }); return m; }
function buildCSV(rcMap){
  rcMap=rcMap||{};
  const ex=expList().slice().reverse();
  let csv="﻿日期,商家,分类,明细,归属,公司承担CAD,私人CAD,支付方式,货币,收据金额,记账汇率,预估CAD,卡上实付CAD,入账CAD,入账依据,商务目的,同席,关联行程,已确认,票据\n";
  ex.forEach(e=>{ const cur=e.currency||defaultCur(); const evt=e.eventId&&S.events[e.eventId];
    csv+=[e.date||"",csvCell(e.merchant),csvCell(e.category),csvCell(e.detail),e.type==="business"?"公司":e.type==="mixed"?"部分公司":"私人",
      companyCAD(e).toFixed(2),personalCAD(e).toFixed(2),e.pay==="card"?"刷卡":"现金/IC卡",cur,e.amountLocal,cur==="CAD"?"1":(e.rate||rate(cur)).toFixed(cur==="USD"?4:5),
      estCAD(e).toFixed(2),+e.paidCAD>0?(+e.paidCAD).toFixed(2):"",cadOf(e).toFixed(2),basisOf(e),csvCell(e.purpose),csvCell(e.attendees),csvCell(evt?evt.title:""),
      isCo(e)?(e.confirmed?"是":"否"):"",csvCell(rcMap[e.id]||(e.noReceipt?"(以确认邮件代替)":""))].join(",")+"\n"; });
  const co=ex.filter(isCo);
  csv+=`\n公司承担合计,,,,,${sumBy(co,companyCAD).toFixed(2)}\n私人合计,,,,,,${sumBy(ex,personalCAD).toFixed(2)}\n`;
  csv+=`\n公司 · 分类小计,笔数,,,,公司承担CAD\n`; catGroups(co,companyCAD).forEach(g=>{ csv+=`${csvCell(g.cat)},${g.list.length},,,,${g.cad.toFixed(2)}\n`; });
  const pn=ex.filter(needsPaid).length; if(pn) csv+=`\n注意:还有 ${pn} 笔刷卡未填卡上实付,入账CAD 暂按汇率估算\n`;
  return csv;
}

/* ================= 地图(不自建地图:把正确的目的地和路线交给 Google / Apple 地图) ================= */
function stopsOf(d){
  const stops=[]; const add=(s)=>{ if(!s||!s.name) return; const last=stops[stops.length-1]; if(last&&last.name===s.name) return; stops.push(s); };
  const last=hotelOn(addDays(d,-1)); if(last) add({name:last.name, o:last, kind:"hotel", note:"出发"});
  arrivalsOn(d).forEach(a=>add({name:a.toPlace||a.to, o:{name:a.toPlace||a.to,localAddress:a.toPlace||""}, kind:a.kind, note:`${a.endTime} ${a.title} 抵达`, via:a}));
  evOn(d).forEach(e=>{
    if(e.kind==="transit"){ if(stops.length) stops[stops.length-1].legOut=e; return; }
    if(e.kind==="flight"||e.kind==="train"){
      add({name:e.fromPlace||e.from, o:{name:e.fromPlace||e.from,localAddress:e.fromPlace||"",lang:e.lang}, kind:e.kind, note:`${e.time} ${e.title} 出发`, ev:e});
      stops[stops.length-1].ride=e;
      if(!e.endDate||e.endDate===d) add({name:e.toPlace||e.to, o:{name:e.toPlace||e.to,localAddress:e.toPlace||"",lang:e.lang}, kind:e.kind, note:`${e.endTime} 抵达`, ev:e});
      return;
    }
    const o=e.kind==="hotel"&&e.hotelId&&S.hotels[e.hotelId]?S.hotels[e.hotelId]:e;
    add({name:o.nameLocal||o.name||e.title, o, kind:e.kind, note:`${e.time} ${e.title}`, ev:e});
  });
  const h=hotelOn(d); if(h) add({name:h.name, o:h, kind:"hotel", note:"今晚住宿"});
  return stops;
}

  if(!stops.length) h+=`<div class="empty">这天没有地点</div>`;
  else{

  h+=list.length?list.map(placeCard).join(""):`<div class="empty">还没有收藏地点 · 看到想去的店就加进来</div>`;

}
function haversine(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng); const x=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

  navigator.geolocation.getCurrentPosition(p=>{ userPos={lat:p.coords.latitude,lng:p.coords.longitude}; render(); },()=>toast("定位失败,请检查权限"),{enableHighAccuracy:true,timeout:8000}); }

function checkItems(){

  evList().forEach(e=>{ if(e._s<now) return; const b=bufferOf(e); if(b&&b.status!=="ok") out.push({lv:b.status==="bad"?"high":"mid", t:`${dstr(e.date)} ${e.time} ${evTitle(e)}:${b.gap!=null?"换乘 "+b.gap+" 分钟":"余量 "+b.slack+" 分钟"}`, d:`${b.why}${b.suggest?` · 建议 ${b.suggest} 出发`:""}`, go:`selDay='${e.date}';goTab('plan')`}); });
  bookTasks().forEach(t=>out.push({lv:t.due<=addDays(d,2)?"high":"mid", t:`还没订:${t.text}`, d:`${t.due?"建议 "+dstr(t.due)+" 前订 · ":""}${t.note}`, go:`openBookFlow('${q(t.group)}')`}));
  evList().filter(e=>e.status==="tbc"&&e._s>now).forEach(e=>out.push({lv:"mid",t:`待确认:${dstr(e.date)} ${e.title}`,d:e.note?e.note.split("\n")[0]:"",go:`selDay='${e.date}';openCard['${e.id}']=true;goTab('plan')`}));
  [...evList().filter(e=>e.cancelBy),...hotelsList().filter(h=>h.cancelBy)].forEach(x=>{ if(x.cancelBy>=d&&x.cancelBy<=addDays(d,5)) out.push({lv:"low",t:`${dstr(x.cancelBy)} 前可免费取消:${x.name||x.title}`,d:"计划有变就在这之前处理",go:x.checkIn?`openHotel('${x.id}')`:`selDay='${x.date}';goTab('plan')`}); });
  // 有没有没住处的晚上
  tripDays().slice(0,-1).forEach(day=>{ if(!hotelOn(day)&&!overnightFlight(day)) out.push({lv:"high",t:`${dstr(day)} 晚上还没有住宿`,d:"",go:`selDay='${day}';goTab('plan')`}); });
  evList().filter(e=>(e.kind==="food")&&e.status==="booked"&&!e.conf&&e._s>now).forEach(e=>out.push({lv:"low",t:`${dstr(e.date)} ${e.title} 没记预约号`,d:"到门口要报预约号时用得上",go:`openEventForm('${e.id}')`}));
  const ex=expList(); const np=ex.filter(needsPaid).length, nr=ex.filter(e=>isCo(e)&&!e.receipt&&!e.noReceipt).length, npu=ex.filter(e=>issuesOf(e).some(i=>i.k==="purpose")).length;
  if(np) out.push({lv:"low",t:`${np} 笔刷卡还没补实付`,d:"",go:"expFilter='paid';goTab('money')"});
  if(nr) out.push({lv:"mid",t:`${nr} 笔公司花费缺票据`,d:"",go:"expFilter='issue';goTab('money')"});
  if(npu) out.push({lv:"mid",t:`${npu} 笔商务餐缺用途/同席`,d:"",go:"expFilter='issue';goTab('money')"});
  if(!S.trip.purpose) out.push({lv:"low",t:"还没填出差目的",d:"出差行程单、报销单要用",go:"openSettings()"});
  return out.sort((a,b)=>PRIO[a.lv]-PRIO[b.lv]);
}

  const urgent=undone.filter(t=>t.due&&t.due<=soon);
  const rest=undone.filter(t=>!urgent.includes(t));
  let h=backTools()+`<div class="bigdate" style="font-size:22px;margin:4px 2px 12px;">清单</div>
    <div class="task-add"><input id="tk_text" placeholder="加一条,如:买 15cm 慕斯圈 ×20" onkeydown="if(event.key==='Enter')addTask()">
      <input id="tk_due" type="date" style="flex:0 0 118px;font-size:13px;padding:8px 6px;"><button class="btn indigo" onclick="addTask()">${ic("plus")}</button></div>`;
  const block=(title,list)=>list.length?`<div class="sec-h"><h2 style="font-size:16px;">${title}</h2><span class="muted">${list.length}</span></div><div class="rowlist">${list.map(t=>taskRowFull(t)).join("")}</div>`:"";

async function aiImport(){
  const text=$("#im_text").value.trim(), imgs=window._imImgs||[];
  if(!text&&!imgs.length){ toast("先粘贴邮件或选截图"); return; }
  $("#im_out").innerHTML=`<div class="hint blue">Claude 正在读…</div>`;
  const schema=`返回 JSON:{"items":[{"op":"add|update","target":"event|hotel|expense","id":"update 时填已有的 id","summary":"一句中文说明","data":{...}}]}
event 字段:kind(flight|train|transit|hotel|food|activity|work), title, date(YYYY-MM-DD), time(HH:MM 当地时间), tz(IANA 时区), endDate, endTime, endTz, from, to, fromCity, toCity, fromPlace, toPlace, carrier, seat, intl(bool), conf, phone, party, sub(一句关键信息), localAddress(当地语言地址), nameLocal, city, lang(ja|ko), status(booked), cancelBy, biz(business|personal), note。
hotel 字段:name, nameLocal, checkIn, checkOut, inTime, outTime, conf, phone, room, prepaid, localAddress, city, currency, lang, cancelBy, biz, note。
